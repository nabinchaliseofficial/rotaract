<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login · Central Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* === same styles as before (omitted for brevity) === */
        :root {
            --bg: #0a0d13;
            --surface: #12161f;
            --surface-2: #171c28;
            --surface-hover: #1c2230;
            --border: rgba(255, 255, 255, 0.08);
            --border-strong: rgba(255, 255, 255, 0.16);
            --text: #f2efe9;
            --text-muted: #8b93a3;
            --text-faint: #5b6272;
            --accent: #e2823f;
            --accent-dim: rgba(226, 130, 63, 0.14);
            --accent-2: #33d6c0;
            --accent-2-dim: rgba(51, 214, 192, 0.14);
            --danger: #f0555f;
            --danger-dim: rgba(240, 85, 95, 0.14);
            --success: #43c98a;
            --success-dim: rgba(67, 201, 138, 0.14);
            --purple: #9b8cf0;
            --font-display: 'Space Grotesk', sans-serif;
            --font-body: 'Inter', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --ease: cubic-bezier(0.16, 1, 0.3, 1);
            --radius: 14px;
        }
        @media (prefers-reduced-motion: reduce) { * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; } }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { height: 100%; }
        body {
            font-family: var(--font-body);
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: radial-gradient(circle at 8% 12%, rgba(226, 130, 63, 0.06) 0%, transparent 40%), radial-gradient(circle at 92% 85%, rgba(51, 214, 192, 0.06) 0%, transparent 40%);
            background-attachment: fixed;
            padding: 20px;
        }
        ::selection { background: var(--accent); color: #0a0d13; }
        :focus-visible { outline: 2px solid var(--accent-2); outline-offset: 2px; border-radius: 4px; }

        .login-wrapper { width: 100%; max-width: 420px; animation: slideUp 0.5s var(--ease); }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

        .login-card {
            background: var(--surface);
            border: 1px solid var(--border-strong);
            border-radius: 20px;
            padding: 40px 36px 36px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }
        .login-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--accent), var(--accent-2), var(--purple));
            opacity: 0.6;
        }
        .login-brand { display: flex; align-items: center; gap: 0.7rem; margin-bottom: 28px; }
        .login-brand .mark {
            width: 44px; height: 44px; border-radius: 12px;
            background: var(--accent-dim); color: var(--accent);
            display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem; flex-shrink: 0;
            border: 1px solid rgba(226, 130, 63, 0.3);
        }
        .login-brand .name { font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; line-height: 1.2; }
        .login-brand .sub { font-size: 0.7rem; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.08em; margin-top: 1px; }
        .login-title { font-family: var(--font-display); font-size: 1.3rem; font-weight: 700; margin-bottom: 4px; }
        .login-subtitle { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 24px; }

        .login-form { display: flex; flex-direction: column; gap: 16px; }
        .form-group { display: flex; flex-direction: column; gap: 5px; }
        .form-group label { font-size: 0.72rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-muted); }
        .form-group .input-wrap { position: relative; display: flex; align-items: center; }
        .form-group .input-wrap i { position: absolute; left: 12px; color: var(--text-faint); font-size: 0.9rem; pointer-events: none; }
        .form-group input {
            width: 100%; padding: 11px 14px 11px 40px;
            background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px;
            color: var(--text); font-family: var(--font-body); font-size: 0.9rem;
            transition: border-color 0.25s var(--ease), box-shadow 0.25s var(--ease);
        }
        .form-group input::placeholder { color: var(--text-faint); }
        .form-group input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); outline: none; }

        .form-options { display: flex; align-items: center; justify-content: space-between; font-size: 0.8rem; margin-top: 2px; }
        .form-options label { display: flex; align-items: center; gap: 0.4rem; color: var(--text-muted); cursor: pointer; font-weight: 500; }
        .form-options label input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer; flex-shrink: 0; }

        .btn-login {
            width: 100%; padding: 13px; border: none; border-radius: 10px;
            background: var(--accent); color: #0a0d13;
            font-family: var(--font-display); font-weight: 700; font-size: 0.95rem;
            cursor: pointer; transition: transform 0.25s var(--ease), background 0.25s var(--ease), opacity 0.25s;
            display: flex; align-items: center; justify-content: center; gap: 0.6rem;
            margin-top: 4px;
        }
        .btn-login:hover:not(:disabled) { transform: translateY(-2px); background: #d4732e; }
        .btn-login:active:not(:disabled) { transform: translateY(0); }
        .btn-login:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .btn-login .spinner { display: none; width: 18px; height: 18px; border: 2px solid rgba(10,13,19,0.2); border-top-color: #0a0d13; border-radius: 50%; animation: spin 0.7s linear infinite; }
        .btn-login.loading .spinner { display: block; }
        .btn-login.loading .btn-text { display: none; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .login-error { display: none; padding: 10px 14px; border-radius: 10px; background: var(--danger-dim); border: 1px solid rgba(240,85,95,0.25); color: var(--danger); font-size: 0.82rem; margin-top: 4px; align-items: center; gap: 0.5rem; }
        .login-error.visible { display: flex; }
        .login-error i { font-size: 0.9rem; }

        .login-footer { margin-top: 24px; padding-top: 18px; border-top: 1px solid var(--border); text-align: center; font-size: 0.75rem; color: var(--text-faint); }

        .auth-loading-overlay {
            display: none;
            position: fixed; inset: 0;
            background: rgba(6, 8, 12, 0.92);
            backdrop-filter: blur(6px);
            z-index: 9999;
            justify-content: center; align-items: center;
            flex-direction: column; gap: 1rem;
        }
        .auth-loading-overlay.active { display: flex; animation: fadeIn 0.3s var(--ease); }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .auth-loading-overlay .spinner-big { width: 40px; height: 40px; border: 3px solid var(--border-strong); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
        .auth-loading-overlay .msg { color: var(--text-muted); font-size: 0.85rem; font-weight: 500; }

        .access-denied-overlay {
            display: none;
            position: fixed; inset: 0;
            background: rgba(6, 8, 12, 0.94);
            backdrop-filter: blur(10px);
            z-index: 9999;
            justify-content: center; align-items: center;
            flex-direction: column; padding: 20px;
        }
        .access-denied-overlay.active { display: flex; animation: fadeIn 0.4s var(--ease); }
        .access-denied-card {
            background: var(--surface); border: 1px solid var(--border-strong); border-radius: 20px;
            padding: 48px 40px; max-width: 460px; width: 100%; text-align: center;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5); animation: slideUp 0.5s var(--ease);
        }
        .access-denied-card .icon-big { font-size: 2.6rem; color: var(--danger); margin-bottom: 18px; display: block; }
        .access-denied-card h2 { font-family: var(--font-display); font-size: 1.6rem; font-weight: 700; margin-bottom: 10px; }
        .access-denied-card p { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 22px; }
        .access-denied-card .btn-redirect { display: inline-block; background: var(--accent); color: #0a0d13; padding: 13px 36px; border-radius: 10px; text-decoration: none; font-weight: 700; font-size: 0.95rem; transition: transform 0.3s var(--ease); border: none; cursor: pointer; }
        .access-denied-card .btn-redirect:hover { transform: translateY(-2px); }

        @media (max-width: 480px) {
            .login-card { padding: 28px 20px 24px; }
            .login-brand .mark { width: 38px; height: 38px; font-size: 1rem; }
            .login-brand .name { font-size: 1rem; }
            .login-title { font-size: 1.1rem; }
            .form-options { flex-wrap: wrap; gap: 6px; }
            .access-denied-card { padding: 32px 20px; }
        }
    </style>
</head>
<body>

    <!-- ===== LOADING OVERLAY ===== -->
    <div class="auth-loading-overlay" id="authLoadingOverlay">
        <div class="spinner-big"></div>
        <div class="msg">Verifying access…</div>
    </div>

    <!-- ===== ACCESS DENIED OVERLAY ===== -->
    <div class="access-denied-overlay" id="accessDeniedOverlay">
        <div class="access-denied-card">
            <span class="icon-big"><i class="fa-solid fa-triangle-exclamation"></i></span>
            <h2>Access denied</h2>
            <p>Only active administrator accounts can open this console.</p>
            <button class="btn-redirect" id="deniedLogoutBtn">Go to homepage</button>
        </div>
    </div>

    <!-- ===== LOGIN CARD ===== -->
    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-brand">
                <span class="mark"><i class="fa-solid fa-layer-group"></i></span>
                <div>
                    <div class="name">Central Hub</div>
                    <div class="sub">Admin Console</div>
                </div>
            </div>
            <h1 class="login-title">Welcome back</h1>
            <p class="login-subtitle">Sign in to manage your club's operations.</p>

            <form class="login-form" id="loginForm" novalidate>
                <div class="form-group">
                    <label for="loginEmail">Email address</label>
                    <div class="input-wrap">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" id="loginEmail" placeholder="admin@club.org" required autocomplete="email" autofocus />
                    </div>
                </div>
                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <div class="input-wrap">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="loginPassword" placeholder="••••••••" required autocomplete="current-password" />
                    </div>
                </div>
                <div class="form-options">
                    <label>
                        <input type="checkbox" id="rememberMe" checked />
                        Remember me
                    </label>
                </div>
                <div class="login-error" id="loginError">
                    <i class="fa-solid fa-circle-exclamation"></i>
                    <span id="loginErrorText">Invalid credentials.</span>
                </div>
                <button type="submit" class="btn-login" id="loginBtn">
                    <span class="spinner"></span>
                    <span class="btn-text"><i class="fa-solid fa-arrow-right-to-bracket"></i> Sign in</span>
                </button>
            </form>

            <div class="login-footer">
                Secure access · Powered by Supabase
            </div>
        </div>
    </div>

    <script>
        (function() {
            "use strict";

            // ============================================================
            //  SUPABASE CONFIG
            // ============================================================
            const SUPABASE_URL = "https://kbyfvqkfcxqgjjtfvvxf.supabase.co/";
            const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtieWZ2cWtmY3hxZ2pqdGZ2dnhmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA2NDM1MzMsImV4cCI6MjA5NjIxOTUzM30.TQQZJJi27pNcXMlD0m8MsrAbqjLHGgVnw-L3bNDR2bU";

            // Default redirect page after login
            const DEFAULT_REDIRECT = '/admin.html';

            function initSupabase() {
                return new Promise((resolve, reject) => {
                    if (typeof supabase !== 'undefined' && supabase.createClient) {
                        resolve(supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY));
                        return;
                    }
                    let attempts = 0;
                    const interval = setInterval(() => {
                        attempts++;
                        if (typeof supabase !== 'undefined' && supabase.createClient) {
                            clearInterval(interval);
                            resolve(supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY));
                            return;
                        }
                        if (attempts >= 10) {
                            clearInterval(interval);
                            reject(new Error('Supabase client failed to load.'));
                        }
                    }, 300);
                });
            }

            const $ = (id) => document.getElementById(id);
            const form = $('loginForm');
            const emailInput = $('loginEmail');
            const passwordInput = $('loginPassword');
            const loginBtn = $('loginBtn');
            const errorEl = $('loginError');
            const errorText = $('loginErrorText');
            const loadingOverlay = $('authLoadingOverlay');
            const deniedOverlay = $('accessDeniedOverlay');

            let supabaseClient = null;

            // ============================================================
            //  LOGIN FUNCTION
            // ============================================================
            async function login(email, password) {
                if (!supabaseClient) {
                    throw new Error('Authentication service is not ready.');
                }

                const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
                if (error) throw new Error(error.message);

                const user = data.user;
                if (!user) throw new Error('No user data returned.');

                // Check role
                let { data: roleData, error: roleError } = await supabaseClient
                    .from('user_roles')
                    .select('role, status')
                    .eq('user_id', user.id)
                    .maybeSingle();

                if (!roleData && user.email) {
                    const { data: emailData } = await supabaseClient
                        .from('user_roles')
                        .select('role, status')
                        .eq('email', user.email)
                        .maybeSingle();
                    roleData = emailData;
                }

                if (!roleData) throw new Error('No role assigned. Contact admin.');
                if (roleData.status !== 'active') throw new Error(`Account is ${roleData.status}.`);

                // Store session
                sessionStorage.setItem('auth_user_id', user.id);
                sessionStorage.setItem('auth_email', user.email);
                sessionStorage.setItem('auth_role', roleData.role);
                sessionStorage.setItem('auth_status', roleData.status);
                sessionStorage.setItem('auth_verified', 'true');
                sessionStorage.setItem('auth_timestamp', Date.now().toString());

                return { user, role: roleData.role, status: roleData.status };
            }

            function getCurrentUser() {
                if (sessionStorage.getItem('auth_verified') !== 'true') return null;
                return {
                    id: sessionStorage.getItem('auth_user_id'),
                    email: sessionStorage.getItem('auth_email'),
                    role: sessionStorage.getItem('auth_role'),
                    status: sessionStorage.getItem('auth_status')
                };
            }

            async function logout() {
                try { if (supabaseClient) await supabaseClient.auth.signOut(); } catch (_) {}
                sessionStorage.removeItem('auth_user_id');
                sessionStorage.removeItem('auth_email');
                sessionStorage.removeItem('auth_role');
                sessionStorage.removeItem('auth_status');
                sessionStorage.removeItem('auth_verified');
                sessionStorage.removeItem('auth_timestamp');
            }

            // ============================================================
            //  REDIRECT HELPER
            // ============================================================
            function redirectAfterLogin() {
                // If there is a stored return URL, use it; otherwise go to admin.html
                let target = sessionStorage.getItem('auth_return_url');
                if (target) {
                    sessionStorage.removeItem('auth_return_url');
                } else {
                    target = DEFAULT_REDIRECT;
                }
                window.location.href = target;
            }

            // ============================================================
            //  INIT
            // ============================================================
            async function init() {
                loadingOverlay.classList.add('active');

                try {
                    supabaseClient = await initSupabase();
                    console.log('✅ Supabase client ready.');

                    const user = getCurrentUser();
                    if (user) {
                        // Already authenticated – redirect
                        redirectAfterLogin();
                        return;
                    }

                    loadingOverlay.classList.remove('active');
                    emailInput.focus();

                } catch (err) {
                    console.error('Auth init error:', err);
                    loadingOverlay.classList.remove('active');
                    showError('Authentication service is unavailable. Please refresh the page.');
                }
            }

            // ============================================================
            //  HANDLE LOGIN FORM SUBMIT
            // ============================================================
            async function handleLogin(e) {
                e.preventDefault();

                const email = emailInput.value.trim();
                const password = passwordInput.value;

                if (!email || !password) {
                    showError('Please enter both email and password.');
                    return;
                }

                errorEl.classList.remove('visible');
                loginBtn.disabled = true;
                loginBtn.classList.add('loading');

                try {
                    await login(email, password);
                    // Success – redirect
                    redirectAfterLogin();
                } catch (err) {
                    console.error('Login error:', err);
                    showError(err.message || 'Invalid email or password. Please try again.');
                    loginBtn.disabled = false;
                    loginBtn.classList.remove('loading');
                    passwordInput.value = '';
                    passwordInput.focus();
                }
            }

            function showError(msg) {
                errorText.textContent = msg;
                errorEl.classList.add('visible');
            }

            // ============================================================
            //  EVENT LISTENERS
            // ============================================================
            passwordInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    form.dispatchEvent(new Event('submit'));
                }
            });
            emailInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    passwordInput.focus();
                }
            });

            form.addEventListener('submit', handleLogin);

            $('deniedLogoutBtn').addEventListener('click', async () => {
                await logout();
                window.location.href = '/index.html';
            });

            // ============================================================
            //  START
            // ============================================================
            init();

        })();
    </script>

</body>
</html>
