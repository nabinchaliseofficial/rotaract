<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Certificate Verification — Rotaract Monthly Quiz</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--navy:#0a1f3d;--em:#0a7d5e;--gold:#b8913b;--muted:#64748b}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#eef5f3,#f5f7fb);font-family:Inter,system-ui,sans-serif;color:var(--navy);display:grid;place-items:center;padding:20px}.card{width:min(680px,100%);background:#fff;border:1px solid #dbe3ec;border-radius:24px;padding:30px;box-shadow:0 20px 60px #0a1f3d14;text-align:center}.seal{width:88px;height:88px;border-radius:50%;margin:auto;display:grid;place-items:center;background:#e5f7ef;border:4px solid var(--em);font-size:40px}.verified{color:var(--em);font-size:30px;font-weight:900;margin:15px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;text-align:left;margin-top:24px}.item{background:#f7fafc;border:1px solid #e3e9ef;border-radius:14px;padding:14px}.item small{display:block;color:var(--muted);margin-bottom:4px}.item b{font-size:17px}@media(max-width:560px){.grid{grid-template-columns:1fr}.card{padding:20px}}</style></head><body><main class="card"><div class="seal">✓</div><div id="status" class="verified">Verifying…</div><h1 id="name">—</h1><p id="quiz" style="color:#64748b">—</p><div id="details" class="grid"></div><p style="margin-top:24px;color:#64748b;font-size:13px">Rotaract Club of Galkot Baglung · Rotaract Monthly Quiz</p></main><script>const SUPABASE_URL="https://kbyfvqkfcxqgjjtfvvxf.supabase.co",SUPABASE_KEY="sb_publishable_-bOiDndDXdz_FgXq1MFkag_ioCcg8nv";const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const p=new URLSearchParams(location.search),code=p.get("code"),qid=p.get("quiz");const $=id=>document.getElementById(id);const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));async function run(){if(!code||!qid){$("status").textContent="❌ Invalid verification link";$("status").style.color="#b42318";return}const {data,error}=await sb.rpc("quiz_verify_certificate",{p_quiz_id:qid,p_code:code});const r=Array.isArray(data)?data[0]:data;if(error||!r){$("status").textContent="❌ Certificate Not Found";$("status").style.color="#b42318";return}$("status").textContent=r.verified?"Certificate Verified ✅":"❌ "+(r.message||"Not verified");if(!r.verified)$("status").style.color="#b42318";$("name").textContent=r.participant_name||"—";$("quiz").textContent=r.quiz_title||"Rotaract Monthly Quiz";$("details").innerHTML=`<div class="item"><small>Score</small><b>${esc(r.score)} / ${esc(r.total_points)}</b></div><div class="item"><small>Rank</small><b>#${esc(r.rank)}</b></div><div class="item"><small>Date</small><b>${esc(r.quiz_date)}</b></div><div class="item"><small>Registration Code</small><b>${esc(r.registration_code)}</b></div>`}run();</script></body></html>
