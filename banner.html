<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Digital Banner - Live Supabase with Nepali Date/Time</title>

    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1a1a2e">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://kbyfvqkfcxqgjjtfvvxf.supabase.co" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* all existing styles (unchanged) */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body,
        html {
            width: 100%;
            height: 100vh;
            height: calc(var(--vh, 1vh) * 100);
            overflow: hidden;
            font-family: 'Mukta', 'Segoe UI', sans-serif;
            background-color: #000;
        }

        .banner-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            height: calc(var(--vh, 1vh) * 100);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px 30px;
            border: 12px solid #d4af37;
            transition: background-image 0.5s ease, border-color 0.3s ease;
            background-color: #1a1a2e;
        }

        .start-screen {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            height: calc(var(--vh, 1vh) * 100);
            z-index: 5000;
            overflow: hidden;
        }

        .start-screen.hidden {
            display: none;
        }

        .curtain {
            position: absolute;
            top: 0;
            width: 50%;
            height: 100%;
            background:
                repeating-linear-gradient(90deg, rgba(0, 0, 0, 0.18) 0px, rgba(0, 0, 0, 0.18) 2px, transparent 2px, transparent 34px),
                linear-gradient(135deg, #8a0f0f 0%, #5c0808 45%, #8a0f0f 100%);
            box-shadow: inset -30px 0 60px rgba(0, 0, 0, 0.45);
            transition: transform 3.2s cubic-bezier(0.65, 0, 0.35, 1);
            z-index: 2;
        }

        .curtain-left {
            left: 0;
            border-right: 5px solid #d4af37;
        }

        .curtain-right {
            right: 0;
            border-left: 5px solid #d4af37;
        }

        .start-screen.opening .curtain-left {
            transform: translateX(-100%);
        }

        .start-screen.opening .curtain-right {
            transform: translateX(100%);
        }

        .start-content {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 22px;
            z-index: 3;
            text-align: center;
            padding: 20px;
            transition: opacity 0.4s ease;
        }

        .start-screen.opening .start-content {
            opacity: 0;
            pointer-events: none;
        }

        .start-screen h1 {
            font-family: 'Mukta', 'Segoe UI', sans-serif;
            font-size: 1.6rem;
            color: rgba(255, 255, 255, 0.6);
            font-weight: 600;
            letter-spacing: 1px;
        }

        .start-btn {
            font-family: 'Mukta', 'Segoe UI', sans-serif;
            font-size: 1.6rem;
            font-weight: 800;
            color: #1a1a2e;
            background: linear-gradient(135deg, #ffd76a, #d4af37);
            border: none;
            padding: 22px 55px;
            border-radius: 16px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.4);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            letter-spacing: 1px;
        }

        .start-btn:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 14px 38px rgba(212, 175, 55, 0.55);
        }

        .start-btn:active {
            transform: translateY(0) scale(0.98);
        }

        @media (max-width: 480px) {
            .start-screen h1 {
                font-size: 1.1rem;
            }
            .start-btn {
                font-size: 1.15rem;
                padding: 16px 34px;
            }
        }

        .header-section {
            width: 100%;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 12px;
            z-index: 10;
            position: relative;
        }

        .live-clock {
            font-size: 1.8rem;
            font-weight: bold;
            color: #111;
            background: rgba(255, 255, 255, 0.9);
            padding: 10px 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(5px);
            border: 2px solid #d4af37;
        }

        .center-logo-container {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            background: rgba(255, 255, 255, 0.15);
            padding: 10px 20px;
            border-radius: 15px;
            backdrop-filter: blur(3px);
            border: 2px solid rgba(212, 175, 55, 0.3);
        }

        .center-logo-container img {
            max-height: 70px;
            max-width: 180px;
            width: auto;
            height: auto;
            object-fit: contain;
        }

        .content-section {
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 5px;
            z-index: 10;
            background: rgba(255, 255, 255, 0.1);
            padding: 20px 40px;
            border-radius: 20px;
            backdrop-filter: blur(5px);
            border: 2px solid rgba(212, 175, 55, 0.2);
            max-width: 90%;
        }

        .meeting-title {
            font-size: calc(var(--meeting-title-size, 4.5rem) * var(--font-scale, 1));
            font-weight: 800;
            color: #d32f2f;
            text-shadow: 3px 3px 0px rgba(255, 255, 255, 0.8),
                -3px -3px 0px rgba(255, 255, 255, 0.8),
                3px -3px 0px rgba(255, 255, 255, 0.8),
                -3px 3px 0px rgba(255, 255, 255, 0.8),
                0px 0px 20px rgba(255, 255, 255, 0.5);
            letter-spacing: 2px;
            line-height: 1.3;
            white-space: normal;
            word-wrap: break-word;
            max-width: 100%;
            margin: 0 auto;
        }

        .sub-meeting-title {
            font-size: calc(var(--sub-meeting-title-size, 2.5rem) * var(--font-scale, 1));
            font-weight: 700;
            color: #e65100;
            text-shadow: 2px 2px 0px rgba(255, 255, 255, 0.7),
                -2px -2px 0px rgba(255, 255, 255, 0.7),
                2px -2px 0px rgba(255, 255, 255, 0.7),
                -2px 2px 0px rgba(255, 255, 255, 0.7);
            letter-spacing: 1px;
            line-height: 1.2;
            white-space: normal;
            word-wrap: break-word;
            max-width: 100%;
            margin: 0 auto;
        }

        .organized-by {
            font-size: calc(var(--organized-by-size, 2.8rem) * var(--font-scale, 1));
            font-weight: 700;
            color: #b71c1c;
            text-shadow: 2px 2px 0px rgba(255, 255, 255, 0.8),
                -2px -2px 0px rgba(255, 255, 255, 0.8),
                2px -2px 0px rgba(255, 255, 255, 0.8),
                -2px 2px 0px rgba(255, 255, 255, 0.8);
            margin-top: 5px;
        }

        /* ===== AGENDA SECTION ===== */
        .agenda-section {
            z-index: 10;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            border: 2px solid rgba(212, 175, 55, 0.3);
            border-radius: 12px;
            padding: 12px 24px;
            max-width: 80%;
            width: 100%;
            margin: 5px auto;
            display: none;
        }

        .agenda-section.visible {
            display: block;
        }

        .agenda-title {
            color: #d4af37;
            font-size: 1.2rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 6px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .agenda-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
            max-height: 120px;
            overflow-y: auto;
        }

        .agenda-item {
            color: rgba(255, 255, 255, 0.9);
            font-size: 1rem;
            padding: 4px 12px;
            border-left: 3px solid #d4af37;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
            text-align: left;
        }

        .agenda-item .agenda-num {
            color: #d4af37;
            font-weight: 700;
            margin-right: 8px;
        }

        /* ===== COUNTDOWN ===== */
        .countdown-section {
            z-index: 10;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            border: 2px solid rgba(212, 175, 55, 0.3);
            border-radius: 12px;
            padding: 8px 24px;
            display: none;
            text-align: center;
        }

        .countdown-section.visible {
            display: block;
        }

        .countdown-label {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .countdown-timer {
            color: #d4af37;
            font-size: 2rem;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            letter-spacing: 2px;
        }

        .countdown-timer.started {
            color: #4caf50;
            font-size: 1.5rem;
        }

        /* ===== INTERNET STATUS (top-right, next to clock) ===== */
        .internet-badge-top {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 46px;
            height: 46px;
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(5px);
            border: 2px solid #d4af37;
            transition: border-color 0.3s ease;
        }

        .internet-badge-top svg {
            width: 24px;
            height: 24px;
            transition: fill 0.3s ease;
        }

        .internet-badge-top.online svg {
            fill: #4caf50;
        }

        .internet-badge-top.offline svg {
            fill: #f44336;
        }

        .internet-badge-top.online {
            border-color: #4caf50;
        }

        .internet-badge-top.offline {
            border-color: #f44336;
        }

        /* ===== SCROLLING NOTICE ===== */
        .scrolling-notice {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 10;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            border-top: 2px solid #d4af37;
            overflow: hidden;
            height: 36px;
            display: none;
            align-items: center;
        }

        .scrolling-notice.visible {
            display: flex;
        }

        .scrolling-notice .ticker {
            display: inline-block;
            white-space: nowrap;
            animation: scrollNotice 20s linear infinite;
            color: #fff;
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            padding-left: 100%;
        }

        @keyframes scrollNotice {
            0% {
                transform: translateX(0);
            }
            100% {
                transform: translateX(-100%);
            }
        }

        .footer-section {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: calc(1.8rem * var(--font-scale, 1));
            font-weight: bold;
            color: #b71c1c;
            padding: 0 20px 10px 20px;
            z-index: 10;
            flex-wrap: wrap;
            gap: 15px;
        }

        .footer-section span {
            background: rgba(255, 255, 255, 0.85);
            padding: 8px 25px;
            border-radius: 10px;
            backdrop-filter: blur(5px);
            border: 2px solid #d4af37;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .footer-section .nepali-date-display {
            background: rgba(255, 255, 255, 0.9);
            padding: 8px 25px;
            border-radius: 10px;
            border: 2px solid #d4af37;
            font-size: calc(var(--date-size, 1.6rem) * var(--font-scale, 1));
        }

        .footer-section .time-display {
            background: rgba(255, 255, 255, 0.9);
            padding: 8px 25px;
            border-radius: 10px;
            border: 2px solid #d4af37;
            font-size: calc(var(--time-size, 1.6rem) * var(--font-scale, 1));
        }

        .footer-left-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .anthem-play-btn {
            width: 38px;
            height: 38px;
            min-width: 38px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.25);
            background: rgba(0, 0, 0, 0.3);
            color: rgba(255, 255, 255, 0.55);
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(3px);
            transition: all 0.25s ease;
            box-shadow: none;
            padding: 0;
        }

        .anthem-play-btn:hover {
            background: rgba(0, 0, 0, 0.5);
            color: rgba(255, 255, 255, 0.9);
        }

        .anthem-play-btn.playing {
            color: rgba(255, 255, 255, 0.85);
            border-color: rgba(212, 175, 55, 0.6);
        }

        .open-link-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.3);
            color: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 16px;
            font-size: 0.85rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            z-index: 1000;
            transition: all 0.3s ease;
            backdrop-filter: blur(3px);
            letter-spacing: 0.5px;
            text-decoration: none;
            display: none;
        }

        .open-link-btn.visible {
            display: inline-block;
        }

        .open-link-btn:hover {
            background: rgba(0, 0, 0, 0.5);
            color: rgba(255, 255, 255, 0.95);
            border-color: rgba(255, 255, 255, 0.4);
        }

        .presentation-buttons-wrap {
            position: absolute;
            top: 62px;
            left: 20px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .presentation-buttons-wrap .open-link-btn {
            position: static;
            display: inline-block;
        }

        .iframe-overlay {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            height: calc(var(--vh, 1vh) * 100);
            background: rgba(0, 0, 0, 0.85);
            z-index: 6000;
            display: none;
            flex-direction: column;
        }

        .iframe-overlay.visible {
            display: flex;
        }

        .iframe-overlay-header {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 10px 14px;
            background: rgba(0, 0, 0, 0.5);
        }

        .iframe-overlay-close {
            background: rgba(255, 255, 255, 0.9);
            color: #1a1a2e;
            border: none;
            padding: 8px 18px;
            font-size: 0.9rem;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            letter-spacing: 0.5px;
        }

        .iframe-overlay-close:hover {
            background: #fff;
        }

        .iframe-overlay-body {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .iframe-overlay-frame {
            border: none;
            background: #fff;
            width: 100%;
            height: 100%;
        }

        .fullscreen-btn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.3);
            color: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 6px 12px;
            font-size: 0.7rem;
            border-radius: 4px;
            cursor: pointer;
            z-index: 1000;
            transition: all 0.3s ease;
            backdrop-filter: blur(3px);
            letter-spacing: 0.5px;
        }

        .fullscreen-btn:hover {
            background: rgba(0, 0, 0, 0.5);
            color: rgba(255, 255, 255, 0.9);
            border-color: rgba(255, 255, 255, 0.4);
        }

        .status-indicator {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.8rem;
            background: rgba(0, 0, 0, 0.5);
            padding: 5px 12px;
            border-radius: 20px;
            z-index: 1000;
            backdrop-filter: blur(3px);
        }

        .status-indicator .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #4caf50;
            border-radius: 50%;
            margin-right: 5px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                opacity: 1;
            }
            50% {
                opacity: 0.3;
            }
            100% {
                opacity: 1;
            }
        }

        /* ===== ANTHEM POPUP (MODAL) ===== */
        .anthem-modal {
            position: fixed;
            inset: 0;
            z-index: 7000;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(6px);
            animation: fadeIn 0.3s ease;
        }

        .anthem-modal.visible {
            display: flex;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .anthem-modal-content {
            background: rgba(26, 26, 46, 0.95);
            border: 2px solid #d4af37;
            border-radius: 24px;
            padding: 30px 40px 40px;
            max-width: 420px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            position: relative;
            text-align: center;
        }

        .anthem-modal-close {
            position: absolute;
            top: 10px;
            right: 15px;
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.6);
            font-size: 1.8rem;
            cursor: pointer;
            transition: color 0.2s;
            line-height: 1;
            padding: 0 4px;
        }

        .anthem-modal-close:hover {
            color: #fff;
        }

        .anthem-modal-title {
            font-family: 'Mukta', sans-serif;
            font-size: 1.4rem;
            font-weight: 700;
            color: #d4af37;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        .anthem-player-controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }

        .anthem-play-pause-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 2px solid #d4af37;
            background: rgba(212, 175, 55, 0.15);
            color: #d4af37;
            font-size: 2.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.2);
        }

        .anthem-play-pause-btn:hover {
            background: rgba(212, 175, 55, 0.3);
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.4);
        }

        .anthem-play-pause-btn:active {
            transform: scale(0.95);
        }

        .anthem-progress-container {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .anthem-progress-bar {
            flex: 1;
            height: 6px;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
            outline: none;
            transition: background 0.2s;
        }

        .anthem-progress-bar::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #d4af37;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
            border: none;
        }

        .anthem-progress-bar::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #d4af37;
            cursor: pointer;
            border: none;
        }

        .anthem-time {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.85rem;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            min-width: 70px;
            text-align: center;
        }

        .anthem-error {
            color: #f44336;
            font-size: 0.9rem;
            margin-top: 10px;
            display: none;
        }

        .anthem-error.visible {
            display: block;
        }

        @media (max-width: 480px) {
            .anthem-modal-content {
                padding: 20px 24px 30px;
            }
            .anthem-play-pause-btn {
                width: 60px;
                height: 60px;
                font-size: 1.8rem;
            }
            .anthem-modal-title {
                font-size: 1.2rem;
            }
        }

        /* responsive adjustments (unchanged) */
        @media (max-width: 1024px) {
            .meeting-title {
                font-size: calc(var(--meeting-title-size, 4.5rem) * var(--font-scale, 1) * 0.78);
            }
            .sub-meeting-title {
                font-size: calc(var(--sub-meeting-title-size, 2.5rem) * var(--font-scale, 1) * 0.8);
            }
            .organized-by {
                font-size: calc(var(--organized-by-size, 2.8rem) * var(--font-scale, 1) * 0.79);
            }
            .footer-section {
                font-size: calc(1.4rem * var(--font-scale, 1));
            }
            .footer-section span {
                font-size: calc(1.2rem * var(--font-scale, 1));
                padding: 6px 18px;
            }
            .footer-section .nepali-date-display {
                font-size: calc(var(--date-size, 1.6rem) * var(--font-scale, 1) * 0.75);
                padding: 6px 18px;
            }
            .footer-section .time-display {

            return `${mins}:${secs.toString().padStart(2, '0')}`;

            anthemCurrentTime.textContent = formatTime(current);

            const percent = (current / duration) * 100;
            anthemProgressBar.value = isNaN(percent) ? 0 : percent;
            anthemPlayPauseBtn.textContent = anthemAudio.paused ? '▶' : '⏸';
            isAnthemPlaying = !anthemAudio.paused;
            // Update footer button icon
            anthemFooterBtn.textContent = anthemAudio.paused ? '▶' : '⏸';

            const nepaliDigits = ['०', '१', '२', '३', '४', '५', '६', '७', '८', '९'];
            return String(input).replace(/[0-9]/g, d => nepaliDigits[d]);

        function getCurrentNepaliDate() {
            const now = new Date();
            const refDate = NepaliDate.referenceEnglishDate;
            const diffDays = Math.floor((now - refDate) / (1000 * 60 * 60 * 24));

            let remainingDays = diffDays;
            let year = NepaliDate.referenceYear;
            let month = NepaliDate.referenceMonth;

            while (remainingDays > 0) {
                const daysInYear = NepaliDate.monthDays[year];
                if (!daysInYear) break;

                const totalDaysInYear = daysInYear.reduce((a, b) => a + b, 0);
                if (remainingDays >= totalDaysInYear) {
                    remainingDays -= totalDaysInYear;
                    year++;
                } else {
                    for (let m = 0; m < daysInYear.length; m++) {
                        if (remainingDays >= daysInYear[m]) {
                            remainingDays -= daysInYear[m];
                            month = m + 1;
                        } else {
                            month = m;
                            break;
                        }
                    }
                    break;
                }
            }

            const day = remainingDays + 1;
            const weekdayIndex = (1 + diffDays) % 7;

            return {
                year: year,
                month: month,
                day: day,
                weekday: NepaliDate.weekdays[weekdayIndex],
                monthName: NepaliDate.months[month]
            };

            return {
                hours: hours,
                minutes: minutes,
                seconds: seconds,
                period: period,
                periodNepali: periodNepali,
                formatted: `${digitsFormatted} ${period}`,

        // ============================================================
        // ===== COUNTDOWN MODULE (unchanged) =====
        // ============================================================
        const CountdownModule = (function() {
            let intervalId = null;
            let onFinishCallback = null;

            function stop() {
                if (intervalId) {
                    clearInterval(intervalId);
                    intervalId = null;
                }
                onFinishCallback = null;
            }

            function start(startTimeStr, onFinish) {
                const section = document.getElementById('countdownSection');
                const timer = document.getElementById('countdownTimer');

                stop();

                onFinishCallback = onFinish || null;

                let hours, minutes;
                const parts24 = startTimeStr.match(/^(\d{1,2}):(\d{2})$/);
                const parts12 = startTimeStr.match(/(\d+):(\d+)\s*(AM|PM)/i);

                if (parts24) {
                    hours = parseInt(parts24[1]);
                    minutes = parseInt(parts24[2]);
                } else if (parts12) {
                    hours = parseInt(parts12[1]);
                    minutes = parseInt(parts12[2]);
                    const period = parts12[3].toUpperCase();
                    if (period === 'PM' && hours !== 12) hours += 12;
                    if (period === 'AM' && hours === 12) hours = 0;
                } else {
                    if (onFinishCallback) onFinishCallback();
                    return;
                }

                const now = new Date();
                let target = new Date(now);
                target.setHours(hours, minutes, 0, 0);

                if (target <= now) {
                    if (onFinishCallback) onFinishCallback();
                    return;
                }

                section.classList.add('visible');

                function tick() {
                    const now = new Date();
                    const diff = target - now;

                    if (diff <= 0) {
                        timer.textContent = '🎉 Program Started';
                        timer.className = 'countdown-timer started';
                        if (onFinishCallback) onFinishCallback();
                        stop();
                        return;
                    }

                    const h = Math.floor(diff / (1000 * 60 * 60));
                    const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                    const s = Math.floor((diff % (1000 * 60)) / 1000);

                    timer.textContent =
                        `${String(h).padStart(2, '0')} : ${String(m).padStart(2, '0')} : ${String(s).padStart(2, '0')}`;
                    timer.className = 'countdown-timer';
                }

                tick();
                intervalId = setInterval(tick, 1000);
            }

            return { start, stop };
        })();

        // ============================================================
        // ===== TYPEWRITER (unchanged) =====
        // ============================================================
        async function playTypewriter(text, times = 3) {
            if (!text || __typewriterRunning) return;
            __typewriterRunning = true;
            const el = document.getElementById('meetingName');
            const typeDelay = 55;
            const eraseDelay = 30;
            const pauseDelay = 450;

            for (let round = 0; round < times; round++) {
                el.innerText = '';
                for (let i = 0; i <= text.length; i++) {
                    el.innerText = text.slice(0, i);
                    await new Promise(r => setTimeout(r, typeDelay));
                }
                await new Promise(r => setTimeout(r, pauseDelay));
                if (round < times - 1) {
                    for (let i = text.length; i >= 0; i--) {
                        el.innerText = text.slice(0, i);
                        await new Promise(r => setTimeout(r, eraseDelay));
                    }
                }
            }
            el.innerText = text;
            __typewriterRunning = false;
        }

        function transformPresentationUrl(url) {
            try {
                const publishedMatch = url.match(/^https:\/\/docs\.google\.com\/presentation\/d\/e\/([a-zA-Z0-9_-]+)/);
                if (publishedMatch) {
                    const pubId = publishedMatch[1];
                    return `https://docs.google.com/presentation/d/e/${pubId}/embed`;
                }

                const slidesMatch = url.match(/^https:\/\/docs\.google\.com\/presentation\/d\/([a-zA-Z0-9_-]+)/);
                if (slidesMatch) {
                    const docId = slidesMatch[1];
                    return `https://docs.google.com/presentation/d/${docId}/embed`;
                }
            } catch (e) {
                console.log('Presentation URL transform skipped:', e);
            }
            return url;
        }

        function renderPresentationButtons(items) {
            const wrap = document.getElementById('presentationButtonsWrap');
            wrap.innerHTML = '';
            if (!items || items.length === 0) return;

            items.forEach((item, idx) => {
                const a = document.createElement('a');
                a.href = '#';
                a.className = 'open-link-btn visible';
                a.dataset.url = item.url;
                const isPdf = /\.pdf(\?|$)/i.test(item.url || '');
                const icon = isPdf ? '📄' : '🎞️';
                const fallback = isPdf ?
                    (items.length > 1 ? `PDF ${idx + 1}` : 'Open PDF') :
                    (items.length > 1 ? `प्रस्तुति ${idx + 1}` : 'Open Presentation');
                const label = item.name && item.name !== '' ? item.name : fallback;
                a.textContent = icon + ' ' + label;
                a.onclick = (event) => openInPageOverlay(event, null, item.url);
                wrap.appendChild(a);
            });
        }

        // ============================================================

        // ============================================================
        function openInPageOverlay(event, btnId, directUrl) {
            if (event) event.preventDefault();
            let url = directUrl;
            let isPresentation = !!directUrl;

            if (!url) {
                const btn = document.getElementById(btnId);
                url = btn && btn.dataset.url;
                isPresentation = btnId === 'openPresentationBtn';
            }
            if (!url) return false;

            const isPdf = isPresentation && /\.pdf(\?|$)/i.test(url);

            if (isPresentation) {
                url = transformPresentationUrl(url);
            }

            if (isPdf) {
                url = 'https://docs.google.com/viewer?url=' + encodeURIComponent(url) + '&embedded=true';
            }

            __overlayIsPresentation = isPresentation && !isPdf;

            document.getElementById('iframeOverlayFrame').src = url;
            document.getElementById('iframeOverlay').classList.add('visible');

            if (__overlayIsPresentation) {
                requestAnimationFrame(() => requestAnimationFrame(fitPresentationFrame));
                setTimeout(fitPresentationFrame, 300);
                setTimeout(fitPresentationFrame, 1000);
            } else {
                resetOverlayFrameSize();
            }
            return false;
        }

        function closeInPageOverlay() {
            document.getElementById('iframeOverlay').classList.remove('visible');
            document.getElementById('iframeOverlayFrame').src = '';
            __overlayIsPresentation = false;
        }

        function fitPresentationFrame() {
            const body = document.getElementById('iframeOverlayBody');
            const frame = document.getElementById('iframeOverlayFrame');
            if (!body || !frame) return;

            const targetRatio = 16 / 9;
            const cw = body.clientWidth;
            const ch = body.clientHeight;
            if (!cw || !ch) return;

            let w, h;
            if (cw / ch > targetRatio) {
                h = ch;
                w = h * targetRatio;
            } else {
                w = cw;
                h = w / targetRatio;
            }

            frame.style.width = Math.floor(w) + 'px';
            frame.style.height = Math.floor(h) + 'px';
        }

        function resetOverlayFrameSize() {
            const frame = document.getElementById('iframeOverlayFrame');
            if (!frame) return;
            frame.style.width = '100%';
            frame.style.height = '100%';
        }

        function refitOverlayIfVisible() {
            if (!document.getElementById('iframeOverlay').classList.contains('visible')) return;
            if (__overlayIsPresentation) {

            const el = document.documentElement;
            const request = el.requestFullscreen ?
                el.requestFullscreen() :
                el.webkitRequestFullscreen ?

            if (request && request.catch) {

                if (document.fullscreenElement) return;
                const el = document.documentElement;
                const request = el.requestFullscreen ?
                    el.requestFullscreen() :
                    el.webkitRequestFullscreen ?
                    el.webkitRequestFullscreen() :
                    null;
                if (request && request.catch) {
                    request.catch(err => console.log('Fullscreen error:', err));
                }

            ['click', 'touchend', 'keydown'].forEach(evt => {
                document.addEventListener(evt, grabFullscreen, { once: true });

        let chiefGuestChannel = null;
        let celebrationChannel = null;

        function setupRealtime() {
            if (realtimeChannel) {
                supabaseClient.removeChannel(realtimeChannel);
            }

            realtimeChannel = supabaseClient
                .channel('public:banner_settings')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'banner_settings' },
                    payload => {
                        console.log('🔄 Realtime event received:', payload.eventType);
                        fetchBannerData();
                        document.getElementById('statusText').textContent = 'अपडेट भयो!';
                        setTimeout(() => {
                            document.getElementById('statusText').textContent = 'लाइभ';
                        }, 2000);
                    }
                )
                .subscribe((status) => {
                    console.log('Realtime channel status:', status);
                    if (status === 'SUBSCRIBED') {
                        document.getElementById('statusText').textContent = 'लाइभ';
                    } else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT' || status === 'CLOSED') {
                        document.getElementById('statusText').textContent = 'पुन: जडान हुँदै...';
                        setTimeout(() => {
                            fetchBannerData();
                            setupRealtime();
                        }, 3000);
                    }
                });

            if (chiefGuestChannel) {
                supabaseClient.removeChannel(chiefGuestChannel);
            }
            chiefGuestChannel = supabaseClient
                .channel('public:app_settings:chief_guest_mode')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'app_settings',
                    filter: 'setting_key=eq.chief_guest_mode' },
                    () => {
                        console.log('🔄 Chief Guest Mode changed, updating start screen...');
                        loadChiefGuestMode();
                    }
                )
                .subscribe();

            if (celebrationChannel) {
                supabaseClient.removeChannel(celebrationChannel);
            }
            celebrationChannel = supabaseClient
                .channel('public:banner_settings:celebration')
                .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'banner_settings' },
                    (payload) => {
                        const newData = payload.new;
                        if (newData && newData.celebration_trigger && newData.celebration_type) {
                            console.log('🎉 Celebration triggered:', newData.celebration_type);
                            triggerCelebration(newData.celebration_type);
                            supabaseClient
                                .from('banner_settings')
                                .update({ celebration_trigger: null, celebration_type: null })
                                .eq('id', newData.id)
                                .then(() => {});
                        }
                    }
                )
                .subscribe();
        }

        // ============================================================
        // ===== INIT =====
        // ============================================================
        window.onload = async () => {
            const cached = loadBannerCache();
            if (cached) {
                applyBannerData(cached);
            }
            await fetchBannerData();
            setupRealtime();
            await loadChiefGuestMode();
            ClockModule.start();
            setInterval(fetchBannerData, 30000);
            setInterval(loadChiefGuestMode, 5000);
            updateInternetStatus();
            setInterval(updateInternetStatus, 5000);
            console.log('✅ Banner initialized successfully!');

            requestAutoFullscreen();
        };
    </script>
</body>
</html>
