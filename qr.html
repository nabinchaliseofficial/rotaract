<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>QR Codes · Rotaract Club of Galkot</title>

    <!-- ===== QRCode.js Library (for client-side generation) ===== -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js">
    </script>

    <!-- ===== Font Awesome Icons ===== -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"/>

    <!-- ===== Supabase JS ===== -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        /* ---------- RESET & ROOT ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #0d47a1;
            --primary-light: #1565c0;
            --primary-dark: #0a2a6e;
            --accent: #c62828;
            --accent-light: #e53935;
            --bg: #f4f7fc;
            --card-bg: #ffffff;
            --shadow: 0 8px 30px rgba(0, 0, 0, 0.10);
            --radius: 16px;
            --transition: 0.25s ease;
            --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            font-family: var(--font);
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: #1e1e2f;
        }

        /* ---------- HEADER ---------- */
        .header {
            background: linear-gradient(135deg, var(--primary-dark), var(--primary));
            padding: 18px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 14px;
            box-shadow: 0 4px 20px rgba(13, 71, 161, 0.35);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header .brand {
            display: flex;
            align-items: center;
            gap: 14px;
            color: #fff;
        }

        .header .brand i {
            font-size: 32px;
            color: #ffd54f;
        }

        .header .brand h1 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 0.3px;
        }

        .header .brand span {
            font-weight: 300;
            opacity: 0.85;
        }

        .header .actions {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        .header .actions a {
            color: #fff;
            text-decoration: none;
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 14px;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(4px);
            transition: var(--transition);
            border: 1px solid rgba(255, 255, 255, 0.10);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .header .actions a:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateY(-2px);
        }

        .header .actions a.active {
            background: var(--accent);
            border-color: var(--accent);
        }

        .header .actions a.active:hover {
            background: var(--accent-light);
        }

        /* ---------- MAIN CONTAINER ---------- */
        .container {
            max-width: 1360px;
            margin: 0 auto;
            padding: 32px 24px;
            flex: 1;
            width: 100%;
        }

        /* ---------- SECTION TITLE ---------- */
        .section-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 28px;
        }

        .section-title h2 {
            font-size: 26px;
            font-weight: 700;
            color: var(--primary-dark);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .section-title h2 i {
            color: var(--accent);
            font-size: 28px;
        }

        .section-title .badge {
            background: var(--primary);
            color: #fff;
            padding: 4px 16px;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 600;
        }

        /* ---------- QR GRID ---------- */
        .qr-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 28px;
        }

        .qr-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 20px 16px 18px;
            text-align: center;
            transition: var(--transition);
            border: 1px solid rgba(0, 0, 0, 0.03);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .qr-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 16px 44px rgba(13, 71, 161, 0.13);
        }

        .qr-card .qr-wrapper {
            background: #fafcff;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid #eaeef5;
            margin-bottom: 14px;
            width: 100%;
            display: flex;
            justify-content: center;
            min-height: 140px;
            align-items: center;
        }

        .qr-card .qr-wrapper canvas,
        .qr-card .qr-wrapper img {
            max-width: 100%;
            height: auto;
            display: block;
        }

        .qr-card .qr-title {
            font-weight: 700;
            font-size: 15px;
            color: var(--primary-dark);
            line-height: 1.4;
            margin-bottom: 4px;
            word-break: break-word;
        }

        .qr-card .qr-url {
            font-size: 11px;
            color: #7a8a9e;
            word-break: break-all;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            padding: 0 4px;
        }

        .qr-card .qr-actions {
            margin-top: 12px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .qr-card .qr-actions button,
        .qr-card .qr-actions a {
            background: transparent;
            border: none;
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
        }

        .qr-card .qr-actions .btn-edit {
            background: #e3edfb;
            color: var(--primary);
        }
        .qr-card .qr-actions .btn-edit:hover {
            background: #c5d9f7;
        }

        .qr-card .qr-actions .btn-delete {
            background: #fde8e8;
            color: var(--accent);
        }
        .qr-card .qr-actions .btn-delete:hover {
            background: #fcd5d5;
        }

        .qr-card .qr-actions .btn-visit {
            background: #e8f5e9;
            color: #2e7d32;
        }
        .qr-card .qr-actions .btn-visit:hover {
            background: #c8e6c9;
        }

        /* ---------- ADMIN FORM ---------- */
        .admin-form {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 28px 32px;
            margin-bottom: 36px;
            border: 1px solid rgba(0, 0, 0, 0.03);
        }

        .admin-form .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr auto;
            gap: 16px;
            align-items: end;
        }

        .admin-form .form-row .field {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .admin-form .form-row .field label {
            font-weight: 600;
            font-size: 13px;
            color: #3d4a5c;
        }

        .admin-form .form-row .field input {
            padding: 10px 14px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 14px;
            transition: var(--transition);
            background: #fafcff;
            width: 100%;
        }

        .admin-form .form-row .field input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(13, 71, 161, 0.12);
            background: #fff;
        }

        .admin-form .form-row .btn-submit {
            padding: 10px 28px;
            border: none;
            border-radius: 10px;
            background: var(--primary);
            color: #fff;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
            height: 44px;
        }

        .admin-form .form-row .btn-submit:hover {
            background: var(--primary-light);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(13, 71, 161, 0.30);
        }

        .admin-form .form-row .btn-submit.cancel {
            background: #9aa6b5;
        }
        .admin-form .form-row .btn-submit.cancel:hover {
            background: #7a8a9e;
        }

        /* ---------- EMPTY STATE ---------- */
        .empty-state {
            text-align: center;
            padding: 48px 20px;
            color: #7a8a9e;
        }

        .empty-state i {
            font-size: 52px;
            color: #d0d9e6;
            margin-bottom: 16px;
        }

        .empty-state h3 {
            font-size: 20px;
            color: #3d4a5c;
            margin-bottom: 6px;
        }

        /* ---------- TOAST ---------- */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #1e2a3a;
            color: #fff;
            padding: 14px 26px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 14px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25);
            transform: translateY(80px);
            opacity: 0;
            transition: all 0.4s ease;
            z-index: 999;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast.success {
            background: #1b5e20;
        }
        .toast.error {
            background: #b71c1c;
        }
        .toast.info {
            background: #0d47a1;
        }

        /* ---------- RESPONSIVE ---------- */
        @media (max-width: 820px) {
            .admin-form .form-row {
                grid-template-columns: 1fr;
            }
            .admin-form .form-row .btn-submit {
                width: 100%;
                justify-content: center;
            }
            .header .brand h1 {
                font-size: 18px;
            }
            .header {
                padding: 14px 18px;
            }
            .container {
                padding: 20px 14px;
            }
            .qr-grid {
                grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
                gap: 18px;
            }
            .section-title h2 {
                font-size: 20px;
            }
        }

        @media (max-width: 480px) {
            .qr-grid {
                grid-template-columns: 1fr 1fr;
                gap: 14px;
            }
            .qr-card {
                padding: 14px 10px;
            }
            .qr-card .qr-title {
                font-size: 13px;
            }
            .header .brand i {
                font-size: 24px;
            }
            .header .brand h1 {
                font-size: 15px;
            }
            .header .actions a {
                font-size: 12px;
                padding: 6px 14px;
            }
            .admin-form {
                padding: 18px 14px;
            }
        }

        /* ---------- SCROLLBAR ---------- */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #eef2f7;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--primary-light);
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <!-- ===== HEADER ===== -->
    <header class="header">
        <div class="brand">
            <i class="fas fa-qrcode"></i>
            <h1>Rotaract <span>Galkot</span></h1>
        </div>
        <div class="actions">
            <a href="qr.html" class="active" id="navQr">
                <i class="fas fa-qrcode"></i> QR Codes
            </a>
            <a href="adminqr.html" id="navAdmin">
                <i class="fas fa-sliders-h"></i> Manage
            </a>
        </div>
    </header>

    <!-- ===== MAIN ===== -->
    <div class="container" id="app">

        <!-- section title -->
        <div class="section-title">
            <h2><i class="fas fa-qrcode"></i> QR Code Directory</h2>
            <span class="badge" id="countBadge">0 links</span>
        </div>

        <!-- QR grid -->
        <div class="qr-grid" id="qrGrid"></div>

        <!-- empty state (hidden by default) -->
        <div class="empty-state" id="emptyState" style="display:none;">
            <i class="fas fa-qrcode"></i>
            <h3>No QR Codes Yet</h3>
            <p>Add your first link from the <a href="adminqr.html" style="color:var(--primary);font-weight:600;">Manage</a> page.</p>
        </div>
    </div>

    <!-- ===== TOAST ===== -->
    <div class="toast" id="toast">
        <i class="fas fa-check-circle"></i>
        <span id="toastMsg">Done!</span>
    </div>

    <script>
        // ============================================================
        //  SUPABASE CONFIGURATION – must match the project used in
        //  adminqr.html (public anon/publishable key only — this key
        //  is safe to expose in client-side code as long as Row Level
        //  Security policies on the tables are set correctly)
        // ============================================================
        const SUPABASE_URL = 'https://kbyfvqkfcxqgjjtfvvxf.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_-bOiDndDXdz_FgXq1MFkag_ioCcg8nv';
        let supabaseClient = null;
        let supabaseInitError = '';
        try {
            if (!window.supabase || typeof window.supabase.createClient !== 'function') {
                throw new Error('Supabase library did not load (check internet connection / ad-blocker).');
            }
            supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        } catch (err) {
            console.error('Supabase init failed:', err);
            supabaseInitError = err.message || 'Failed to connect to Supabase.';
        }

        // ============================================================
        //  DATA LAYER – Supabase table: 'qr_codes'
        //  (previously localStorage, so entries added by an admin on
        //   one device/browser never showed up for real visitors)
        // ============================================================

        // ---------- helpers ----------
        async function loadData() {
            if (!supabaseClient) {
                showToast(supabaseInitError || 'Failed to connect to Supabase.', 'error');
                return [];
            }
            const { data, error } = await supabaseClient
                .from('qr_codes')
                .select('*')
                .order('sort_order', { ascending: true })
                .order('created_at', { ascending: true });

            if (error) {
                console.error('Error loading QR codes:', error);
                showToast('Failed to load QR codes.', 'error');
                return [];
            }
            return data || [];
        }

        // ---------- render QR codes ----------
        async function renderQrGrid() {
            const data = await loadData();
            const grid = document.getElementById('qrGrid');
            const empty = document.getElementById('emptyState');
            const badge = document.getElementById('countBadge');

            if (!data || data.length === 0) {
                grid.innerHTML = '';
                empty.style.display = 'block';
                badge.textContent = '0 links';
                return;
            }
            empty.style.display = 'none';
            badge.textContent = data.length + ' link' + (data.length > 1 ? 's' : '');

            // Build cards
            let html = '';
            data.forEach((item, index) => {
                const encodedUrl = encodeURIComponent(item.url);
                // Use QR Server API for image – clean & reliable
                const qrSrc =
                    `https://api.qrserver.com/v1/create-qr-code/?size=220x220&margin=14&data=${encodedUrl}`;

                html += `
                        <div class="qr-card" data-id="${item.id}">
                            <div class="qr-wrapper">
                                <img src="${qrSrc}" alt="QR Code for ${item.title}" 
                                     loading="lazy" width="200" height="200"
                                     onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22200%22%3E%3Crect fill=%22%23f0f2f5%22 width=%22200%22 height=%22200%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 text-anchor=%22middle%22 dy=%22.3em%22 fill=%22%239aa6b5%22 font-size=%2214%22 font-family=%22sans-serif%22%3EQR Error%3C/text%3E%3C/svg%3E'">
                            </div>
                            <div class="qr-title">${escapeHtml(item.title)}</div>
                            <div class="qr-url">${escapeHtml(item.url)}</div>
                            <div class="qr-actions">
                                <a href="${escapeHtml(item.url)}" target="_blank" rel="noopener" class="btn-visit">
                                    <i class="fas fa-external-link-alt"></i> Visit
                                </a>
                            </div>
                        </div>
                    `;
            });

            grid.innerHTML = html;
        }

        // simple escape
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ---------- toast ----------
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const msg = document.getElementById('toastMsg');
            toast.className = 'toast ' + type;
            msg.textContent = message;
            toast.classList.add('show');
            clearTimeout(toast._timer);
            toast._timer = setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // ---------- init ----------
        document.addEventListener('DOMContentLoaded', function() {
            renderQrGrid();

            // highlight active nav
            const path = window.location.pathname.split('/').pop() || 'qr.html';
            document.getElementById('navQr').classList.toggle('active', path === 'qr.html');
            document.getElementById('navAdmin').classList.toggle('active', path === 'adminqr.html');

            // Live-update this page whenever an admin adds/edits/deletes
            // a QR code, without needing a manual refresh.
            if (supabaseClient) {
                supabaseClient
                    .channel('qr_codes_public_changes')
                    .on('postgres_changes', { event: '*', schema: 'public', table: 'qr_codes' }, function() {
                        renderQrGrid();
                    })
                    .subscribe();
            }
        });
    </script>

</body>
</html>
