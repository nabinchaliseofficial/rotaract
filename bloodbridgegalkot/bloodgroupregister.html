<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Blood Bridge Galkot | New Donor Registration</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --red:#b91c1c;
    --red-dark:#7f1d1d;
    --bg:#fdf2f2;
    --card:#ffffff;
    --text:#1f1a1a;
    --muted:#6b7280;
    --border:#f1d6d6;
    --success:#15803d;
    --success-bg:#dcfce7;
    --error:#b91c1c;
    --error-bg:#fee2e2;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI', Roboto, -apple-system, sans-serif;
    background:linear-gradient(180deg,var(--bg),#fff 40%);
    color:var(--text);
    min-height:100vh;
    padding:24px 16px 60px;
  }
  .wrap{max-width:560px;margin:0 auto;}
  .header{text-align:center;margin-bottom:24px;}
  .header .drop{
    width:56px;height:56px;border-radius:50%;
    background:var(--red);display:flex;align-items:center;justify-content:center;
    margin:0 auto 12px;font-size:28px;color:#fff;
  }
  .header h1{font-size:22px;margin:0 0 4px;color:var(--red-dark);}
  .header p{margin:0;color:var(--muted);font-size:14px;}
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:24px 20px;
    box-shadow:0 4px 24px rgba(185,28,28,0.06);
  }
  .field{margin-bottom:16px;}
  label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:#374151;}
  label .req{color:var(--red);}
  input, select{
    width:100%;
    padding:11px 12px;
    border:1.5px solid var(--border);
    border-radius:10px;
    font-size:15px;
    background:#fff;
    color:var(--text);
    transition:border-color .15s;
  }
  input:focus, select:focus{
    outline:none;
    border-color:var(--red);
  }
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .bg-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:4px;}
  .bg-option{
    border:1.5px solid var(--border);
    border-radius:10px;
    text-align:center;
    padding:10px 4px;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
    user-select:none;
    transition:all .15s;
    color:var(--text);
  }
  .bg-option.selected{
    background:var(--red);
    color:#fff;
    border-color:var(--red);
  }
  button.submit{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    background:var(--red);
    color:#fff;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    margin-top:8px;
    transition:background .15s;
  }
  button.submit:hover{background:var(--red-dark);}
  button.submit:disabled{background:#d1a3a3;cursor:not-allowed;}
  .msg{
    margin-top:14px;
    padding:12px 14px;
    border-radius:10px;
    font-size:14px;
    display:none;
  }
  .msg.show{display:block;}
  .msg.success{background:var(--success-bg);color:var(--success);}
  .msg.error{background:var(--error-bg);color:var(--error);}
  .note{font-size:12px;color:var(--muted);text-align:center;margin-top:16px;line-height:1.5;}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="drop">🩸</div>
    <h1>Blood Bridge Galkot</h1>
    <p>New Donor Registration Form</p>
  </div>

  <div class="card">
    <form id="registerForm">
      <div class="field">
        <label>Full Name <span class="req">*</span></label>
        <input type="text" id="person_name" required placeholder="e.g. Ram Bahadur Thapa" />
      </div>

      <div class="row2">
        <div class="field">
          <label>Age</label>
          <input type="number" id="age" min="16" max="70" placeholder="e.g. 25" />
        </div>
        <div class="field">
          <label>Sex</label>
          <select id="sex">
            <option value="">Select</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label>Blood Group <span class="req">*</span></label>
        <div class="bg-grid" id="bgGrid">
          <div class="bg-option" data-value="A+">A+</div>
          <div class="bg-option" data-value="A-">A-</div>
          <div class="bg-option" data-value="B+">B+</div>
          <div class="bg-option" data-value="B-">B-</div>
          <div class="bg-option" data-value="AB+">AB+</div>
          <div class="bg-option" data-value="AB-">AB-</div>
          <div class="bg-option" data-value="O+">O+</div>
          <div class="bg-option" data-value="O-">O-</div>
        </div>
      </div>

      <div class="row2">
        <div class="field">
          <label>Municipality <span class="req">*</span></label>
          <input type="text" id="municipality" required placeholder="e.g. Galkot Municipality" />
        </div>
        <div class="field">
          <label>Ward No.</label>
          <input type="text" id="ward_number" placeholder="e.g. 5" />
        </div>
      </div>

      <div class="field">
        <label>Phone Number <span class="req">*</span></label>
        <input type="tel" id="phone_number" required placeholder="e.g. 98XXXXXXXX" pattern="[0-9]{7,15}" />
      </div>

      <div class="field">
        <label>Your Name (entered by)</label>
        <input type="text" id="data_entry_by" placeholder="Optional" />
      </div>

      <button type="submit" class="submit" id="submitBtn">Register</button>

      <div class="msg" id="msgBox"></div>
    </form>

    <p class="note">Your information will appear in the public list only after it is approved by an admin.</p>
  </div>
</div>

<script>
  // ---- SUPABASE CONFIG ----
  const SUPABASE_URL = "https://kbyfvqkfcxqgjjtfvvxf.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_-bOiDndDXdz_FgXq1MFkag_ioCcg8nv";
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  // --------------------------

  let selectedBloodGroup = "";
  const bgGrid = document.getElementById("bgGrid");
  bgGrid.addEventListener("click", (e) => {
    const opt = e.target.closest(".bg-option");
    if (!opt) return;
    document.querySelectorAll(".bg-option").forEach(el => el.classList.remove("selected"));
    opt.classList.add("selected");
    selectedBloodGroup = opt.dataset.value;
  });

  const form = document.getElementById("registerForm");
  const submitBtn = document.getElementById("submitBtn");
  const msgBox = document.getElementById("msgBox");

  function showMsg(text, type) {
    msgBox.textContent = text;
    msgBox.className = "msg show " + type;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    msgBox.className = "msg";

    const person_name = document.getElementById("person_name").value.trim();
    const age = document.getElementById("age").value.trim();
    const sex = document.getElementById("sex").value;
    const municipality = document.getElementById("municipality").value.trim();
    const ward_number = document.getElementById("ward_number").value.trim();
    const phone_number = document.getElementById("phone_number").value.trim();
    const data_entry_by = document.getElementById("data_entry_by").value.trim();

    if (!selectedBloodGroup) {
      showMsg("Please select your blood group.", "error");
      return;
    }
    if (!person_name || !municipality || !phone_number) {
      showMsg("Please fill in all required (*) fields.", "error");
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = "Submitting...";

    try {
      const { error } = await supabaseClient.from("bloodbridge_register").insert([{
        person_name,
        age: age || null,
        sex: sex || null,
        blood_group: selectedBloodGroup,
        municipality,
        ward_number: ward_number || null,
        phone_number,
        data_entry_by: data_entry_by || null,
        status: "pending"
      }]);

      submitBtn.disabled = false;
      submitBtn.textContent = "Register";

      if (error) {
        if (error.code === "23505") {
          showMsg("This phone number is already registered.", "error");
        } else {
          showMsg("Error: " + error.message, "error");
        }
        return;
      }

      showMsg("Thank you! Your registration was successful. It is awaiting approval.", "success");
      form.reset();
      document.querySelectorAll(".bg-option").forEach(el => el.classList.remove("selected"));
      selectedBloodGroup = "";
    } catch (err) {
      submitBtn.disabled = false;
      submitBtn.textContent = "Register";
      showMsg("Network error: could not reach the server. Check your internet connection and try again. (" + err.message + ")", "error");
    }
  });
</script>
</body>
</html>
