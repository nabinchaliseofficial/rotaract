<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FAQs - Rotaract Club</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f6f8fb;
    color:#172033;
    line-height:1.6;
}

/* =========================
   TOP HOME BAR
========================= */

.header{
    background:#111827;
    padding:14px 20px;
}

.header-inner{
    max-width:1000px;
    margin:auto;
}

.home-button{
    display:inline-flex;
    align-items:center;
    gap:6px;
    color:#fff;
    text-decoration:none;
    background:#e11d48;
    padding:9px 16px;
    border-radius:8px;
    font-size:14px;
    font-weight:600;
    transition:.2s;
}

.home-button:hover{
    background:#be123c;
}

/* =========================
   MAIN CONTAINER
========================= */

.container{
    max-width:1000px;
    margin:auto;
    padding:30px 18px 60px;
}

/* =========================
   HERO
========================= */

.hero{
    background:linear-gradient(
        135deg,
        #111827,
        #263a63
    );
    color:#fff;
    padding:55px 25px;
    border-radius:20px;
    text-align:center;
    margin-bottom:25px;
}

.hero h1{
    font-size:40px;
    margin-bottom:10px;
}

.hero h1 span{
    color:#fb7185;
}

.hero p{
    max-width:680px;
    margin:auto;
    opacity:.9;
}

/* =========================
   CONTROLS
========================= */

.controls{
    background:#fff;
    padding:16px;
    border-radius:14px;
    margin-bottom:20px;
    box-shadow:0 4px 20px rgba(0,0,0,.05);
}

.search{
    width:100%;
    padding:13px 15px;
    border:1px solid #d8dee9;
    border-radius:10px;
    font-size:15px;
    outline:none;
}

.search:focus{
    border-color:#e11d48;
}

/* =========================
   CATEGORIES
========================= */

.categories{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-top:13px;
}

.category{
    border:1px solid #d8dee9;
    background:#fff;
    padding:8px 14px;
    border-radius:30px;
    cursor:pointer;
    font-size:13px;
    transition:.2s;
}

.category:hover{
    border-color:#e11d48;
    color:#e11d48;
}

.category.active{
    background:#e11d48;
    color:#fff;
    border-color:#e11d48;
}

/* =========================
   FAQ LIST
========================= */

.faq-list{
    display:flex;
    flex-direction:column;
    gap:12px;
}

.faq{
    background:#fff;
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 3px 15px rgba(0,0,0,.05);
}

.question{
    padding:18px 20px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    transition:.2s;
}

.question:hover{
    background:#fafafa;
}

.question-text{
    font-weight:700;
    flex:1;
}

.badge{
    display:inline-block;
    background:#fce7f3;
    color:#be123c;
    padding:4px 9px;
    border-radius:20px;
    font-size:11px;
    margin-top:7px;
}

.arrow{
    font-size:18px;
    transition:.25s;
    flex-shrink:0;
}

.faq.open .arrow{
    transform:rotate(180deg);
}

.answer{
    display:none;
    padding:0 20px 20px;
    color:#4b5563;
    white-space:pre-wrap;
}

.faq.open .answer{
    display:block;
}

/* =========================
   LOADING / EMPTY STATE
========================= */

.state{
    background:#fff;
    border-radius:14px;
    padding:50px 20px;
    text-align:center;
    color:#667085;
}

.spinner{
    width:35px;
    height:35px;
    border:4px solid #e5e7eb;
    border-top-color:#e11d48;
    border-radius:50%;
    animation:spin .8s linear infinite;
    margin:0 auto 12px;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

/* =========================
   FOOTER
========================= */

.footer{
    background:#111827;
    color:#9ca3af;
    text-align:center;
    padding:25px 15px;
    margin-top:30px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    .header{
        padding:12px 15px;
    }

    .container{
        padding:20px 12px 45px;
    }

    .hero{
        padding:40px 18px;
        border-radius:16px;
    }

    .hero h1{
        font-size:30px;
    }

    .hero p{
        font-size:14px;
    }

    .question{
        padding:15px;
    }

    .answer{
        padding:0 15px 17px;
    }

    .category{
        padding:7px 12px;
    }
}

/* ===== FAQ LEARNING CENTER ADDITIONS ===== */
.learning-sections{display:grid;gap:18px;margin:20px 0}
.learning-section{background:#fff;border-radius:16px;padding:18px;box-shadow:0 4px 20px rgba(0,0,0,.05)}

.mini-card{border:1px solid #e5e7eb;border-radius:12px;padding:14px;cursor:pointer;background:#fff}
.mini-card:hover{border-color:#e11d48}.mini-card h3{font-size:14px;margin-bottom:6px}.mini-card p{font-size:12px;color:#667085}
.featured-ribbon{display:inline-block;background:#fff7ed;color:#c2410c;padding:4px 8px;border-radius:999px;font-size:11px;margin-bottom:7px}

.no-results-actions{margin-top:12px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.clear-search-btn{border:0;background:#e11d48;color:#fff;padding:9px 14px;border-radius:8px;cursor:pointer}

.study-content{overflow:auto;padding:24px 28px;outline:none;flex:1}

.study-content p{margin:0 0 14px}.study-content ul,.study-content ol{margin:8px 0 16px 25px}.study-content h1,.study-content h2,.study-content h3{margin:18px 0 10px}.study-content a{color:#e11d48}
.study-tools{padding:10px 18px;border-top:1px solid #e5e7eb;display:flex;gap:7px;flex-wrap:wrap;align-items:center;background:#f8fafc}
.study-tools button{border:1px solid #d5dbe5;background:#fff;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:12px}

.study-theme-normal{background:#fff;color:#172033}.study-theme-sepia{background:#f7f0df;color:#4b4030}.study-theme-dark{background:#111827;color:#e5e7eb}.study-theme-dark .study-header,.study-theme-dark .study-footer,.study-theme-dark .study-tools{background:#1f2937;color:#fff;border-color:#374151}.study-theme-dark .study-tools button{background:#111827;color:#fff;border-color:#4b5563}.study-theme-sepia .study-header,.study-theme-sepia .study-footer,.study-theme-sepia .study-tools{background:#f1e8d2}
body.modal-open{overflow:hidden}
@media(max-width:700px){
 .faq-modal{padding:0}.study-dialog{width:100%;height:100%;max-height:100vh;border-radius:0}
 .study-header{padding:14px 15px}.study-header h2{font-size:19px}.study-content{padding:20px 17px;font-size:16px}.study-content.study-wide{font-size:18px}
 .study-footer{position:sticky;bottom:0}.study-nav{width:100%}.study-nav button{flex:1}.study-tools{overflow:auto;flex-wrap:nowrap}
}
@media print{
 body>*:not(#faqStudyModal){display:none!important}.faq-modal{position:static!important;display:block!important;background:#fff!important;padding:0}.study-dialog{max-height:none!important;box-shadow:none!important;border:0}.study-tools,.study-footer,.study-close,.study-progress-wrap{display:none!important}.study-content{overflow:visible!important}
}

</style>

<script>

/* ==========================================
   SUPABASE CONFIGURATION
========================================== */

const SUPABASE_URL =
    "https://kbyfvqkfcxqgjjtfvvxf.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_-bOiDndDXdz_FgXq1MFkag_ioCcg8nv";


/* ==========================================
   CREATE SUPABASE CLIENT
========================================== */

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* ==========================================
   VARIABLES
========================================== */

let allFAQs = [];

let selectedCategory = "all";

let searchText = "";


/* ==========================================
   DOM ELEMENTS
========================================== */

const faqContainer =
    document.getElementById(
        "faqContainer"
    );

const searchInput =
    document.getElementById(
        "searchInput"
    );

const categories =
    document.getElementById(
        "categories"
    );


/* ==========================================
   LOAD FAQS
========================================== */

async function loadFAQs(){

    faqContainer.innerHTML = `
        <div class="state">

            <div class="spinner"></div>

            <p>
                Loading FAQs...
            </p>

        </div>
    `;


    const {
        data,
        error
    } =
    await supabaseClient

        .from("faqs")

        .select("*")

        .eq(
            "is_published",
            true
        )

        .order(
            "display_order",
            {
                ascending:true
            }
        )

        .order(
            "created_at",
            {
                ascending:true
            }
        );


    /* =========================
       ERROR
    ========================= */

    if(error){

        console.error(
            "FAQ loading error:",
            error
        );

        faqContainer.innerHTML = `
            <div class="state">

                <p>
                    Unable to load FAQs.
                    Please try again later.
                </p>

            </div>
        `;

        return;
    }


    /* =========================
       STORE DATA
    ========================= */

    allFAQs = data || [];


    /* =========================
       RENDER
    ========================= */

    renderCategories();

    renderFAQs();
}


/* ==========================================
   RENDER CATEGORY BUTTONS
========================================== */

function renderCategories(){

    const uniqueCategories =
        new Set();


    allFAQs.forEach(
        function(faq){

            const category =
                String(
                    faq.category || ""
                ).trim();


            if(category){

                uniqueCategories.add(
                    category
                );

            }

        }
    );


    categories.innerHTML = "";


    /* =========================
       ALL BUTTON
    ========================= */

    const allButton =
        document.createElement(
            "button"
        );


    allButton.className =
        "category " +
        (
            selectedCategory === "all"
            ? "active"
            : ""
        );


    allButton.textContent =
        "All";


    allButton.type =
        "button";


    allButton.onclick =
        function(){

            selectedCategory =
                "all";

            renderCategories();

            renderFAQs();

        };


    categories.appendChild(
        allButton
    );


    /* =========================
       CATEGORY BUTTONS
    ========================= */

    [...uniqueCategories]
        .sort()
        .forEach(
            function(category){

                const button =
                    document.createElement(
                        "button"
                    );


                button.className =
                    "category " +
                    (
                        selectedCategory ===
                        category
                        ? "active"
                        : ""
                    );


                button.textContent =
                    category;


                button.type =
                    "button";


                button.onclick =
                    function(){

                        selectedCategory =
                            category;

                        renderCategories();

                        renderFAQs();

                    };


                categories.appendChild(
                    button
                );

            }
        );
}


/* ==========================================
   RENDER FAQS
========================================== */

function renderFAQs(){

    let filteredFAQs =
        [...allFAQs];


    /* =========================
       CATEGORY FILTER
    ========================= */

    if(
        selectedCategory !==
        "all"
    ){

        filteredFAQs =
            filteredFAQs.filter(
                function(faq){

                    return String(
                        faq.category || ""
                    ).trim() ===
                    selectedCategory;

                }
            );

    }


    /* =========================
       SEARCH FILTER
    ========================= */

    const query =
        searchText
            .trim()
            .toLowerCase();


    if(query){

        filteredFAQs =
            filteredFAQs.filter(
                function(faq){

                    const question =
                        String(
                            faq.question || ""
                        ).toLowerCase();


                    const answer =
                        String(
                            faq.answer || ""
                        ).replace(/<[^>]*>/g, " ").toLowerCase();


                    const category =
                        String(
                            faq.category || ""
                        ).toLowerCase();


                    return (

                        question.includes(
                            query
                        )

                        ||

                        answer.includes(
                            query
                        )

                        ||

                        category.includes(
                            query
                        )

                    );

                }
            );

    }


    /* =========================
       NO RESULTS
    ========================= */

    if(
        filteredFAQs.length === 0
    ){

        faqContainer.innerHTML = `
            <div class="state">

                <p>
                    ${
                        query ||
                        selectedCategory !== "all"
                        ? "No FAQs match your search."
                        : "No FAQs available at the moment."
                    }
                </p>

            </div>
        `;

        return;
    }


    /* =========================
       CREATE LIST
    ========================= */

    const list =
        document.createElement(
            "div"
        );


    list.className =
        "faq-list";


    filteredFAQs.forEach(
        function(faq){

            /* =====================
               FAQ ITEM
            ===================== */

            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "faq";


            /* =====================
               QUESTION
            ===================== */

            const question =
                document.createElement(
                    "div"
                );


            question.className =
                "question";


            /* =====================
               QUESTION TEXT
            ===================== */

            const questionText =
                document.createElement(
                    "div"
                );


            questionText.className =
                "question-text";


            const heading =
                document.createElement(
                    "div"
                );


            heading.textContent =
                faq.question || "";


            questionText.appendChild(
                heading
            );


            /* =====================
               CATEGORY BADGE
            ===================== */

            if(faq.category){

                const badge =
                    document.createElement(
                        "span"
                    );


                badge.className =
                    "badge";


                badge.textContent =
                    faq.category;


                questionText.appendChild(
                    badge
                );

            }


            /* =====================
               ARROW
            ===================== */

            const arrow =
                document.createElement(
                    "span"
                );


            arrow.className =
                "arrow";


            arrow.textContent =
                "▼";


            /* =====================
               APPEND QUESTION
            ===================== */

            question.appendChild(
                questionText
            );

            question.appendChild(
                arrow
            );


            /* =====================
               ANSWER
            ===================== */

            const answer =
                document.createElement(
                    "div"
                );


            answer.className =
                "answer";


            answer.innerHTML =
                faq.answer || "";


            /* =====================
               CLICK
            ===================== */

            question.onclick =
                function(){

                    /*
                     * Close all other FAQs
                     */

                    document
                        .querySelectorAll(
                            ".faq.open"
                        )
                        .forEach(
                            function(openFAQ){

                                if(
                                    openFAQ !==
                                    item
                                ){

                                    openFAQ.classList
                                        .remove(
                                            "open"
                                        );

                                }

                            }
                        );


                    /*
                     * Toggle current FAQ
                     */

                    item.classList.toggle(
                        "open"
                    );

                };


            /* =====================
               FINAL APPEND
            ===================== */

            item.appendChild(
                question
            );

            item.appendChild(
                answer
            );

            list.appendChild(
                item
            );

        }
    );


    faqContainer.innerHTML = "";

    faqContainer.appendChild(
        list
    );
}


/* ==========================================
   SEARCH EVENT
========================================== */

searchInput.addEventListener(
    "input",
    function(){

        searchText =
            searchInput.value;

        renderFAQs();

    }
);



/* ===== FAQ LEARNING CENTER JAVASCRIPT ===== */
let currentStudyIndex = -1;
let studyMode = false;
let studyFontSize = Number(localStorage.getItem("faqStudyFontSize") || 16);
let studyTheme = localStorage.getItem("faqStudyTheme") || "normal";
let sessionId = localStorage.getItem("faqLearningSessionId");
if(!sessionId){ sessionId = (crypto.randomUUID ? crypto.randomUUID() : "s-"+Date.now()+"-"+Math.random().toString(36).slice(2)); localStorage.setItem("faqLearningSessionId",sessionId); }
const studiedKey="faqStudiedIds";
function studiedIds(){ try{return JSON.parse(localStorage.getItem(studiedKey)||"[]")}catch{return[]}}
function isStudied(id){return studiedIds().map(String).includes(String(id))}
function markStudied(id){const a=studiedIds().map(String);if(!a.includes(String(id))){a.push(String(id));localStorage.setItem(studiedKey,JSON.stringify(a))}}

const learningSections=document.getElementById("learningSections");
const modal=document.getElementById("faqStudyModal");
const dialog=document.querySelector(".study-dialog");
const studyQuestion=document.getElementById("studyQuestion");
const studyCategory=document.getElementById("studyCategory");
const studyContent=document.getElementById("studyContent");
const studyProgress=document.getElementById("studyProgress");

function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function formatDate(v){if(!v)return "—";const d=new Date(v);return isNaN(d)?"—":d.toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"})}
function categoryCounts(){const m={};allFAQs.forEach(f=>{const c=String(f.category||"Uncategorized").trim()||"Uncategorized";m[c]=(m[c]||0)+1});return m}

async function analyticsFor(ids){
  const result={views:{},helpful:{},notHelpful:{}};
  if(!ids.length)return result;
  try{
    const [v,h,n]=await Promise.all([
      supabaseClient.from("faq_views").select("faq_id").in("faq_id",ids),
      supabaseClient.from("faq_feedback").select("faq_id,is_helpful").in("faq_id",ids),
      supabaseClient.from("faq_feedback").select("faq_id,is_helpful").in("faq_id",ids)
    ]);
    (v.data||[]).forEach(x=>result.views[x.faq_id]=(result.views[x.faq_id]||0)+1);
    (h.data||[]).forEach(x=>{if(x.is_helpful===true)result.helpful[x.faq_id]=(result.helpful[x.faq_id]||0)+1});
    (n.data||[]).forEach(x=>{if(x.is_helpful===false)result.notHelpful[x.faq_id]=(result.notHelpful[x.faq_id]||0)+1});
  }catch(e){console.warn("FAQ analytics unavailable:",e)}
  return result;
}

async function renderLearningSections(){
  if(!learningSections)return;
  const counts=categoryCounts();
  const ids=allFAQs.map(f=>f.id).filter(Boolean);
  const a=await analyticsFor(ids);
  const popular=[...allFAQs].sort((x,y)=>(a.helpful[y.id]||0)+(a.views[y.id]||0)*.15-(a.helpful[x.id]||0)-(a.views[x.id]||0)*.15).slice(0,4);
  const featured=allFAQs.filter(f=>f.is_featured===true).slice(0,4);
  const recent=[...allFAQs].filter(f=>f.updated_at).sort((x,y)=>new Date(y.updated_at)-new Date(x.updated_at)).slice(0,4);
  let html=`<section class="learning-section"><h2>📚 Browse by Category</h2><div class="category-cards"><button class="category-card" onclick="selectLearningCategory('all')"><strong>All FAQs</strong><small>${allFAQs.length} FAQs</small></button>`;
  Object.entries(counts).sort().forEach(([c,n])=>html+=`<button class="category-card" onclick="selectLearningCategory(${JSON.stringify(c)})"><strong>${esc(c)}</strong><small>${n} FAQs</small></button>`);
  html+=`</div></section>`;
  if(featured.length) html+=`<section class="learning-section"><h2>⭐ Featured FAQs</h2><div class="featured-grid">${featured.map(f=>miniCard(f,"⭐ Featured")).join("")}</div></section>`;
  if(popular.length) html+=`<section class="learning-section"><h2>⭐ Popular Questions</h2><div class="popular-grid">${popular.map(f=>miniCard(f,`${a.views[f.id]||0} views · ${a.helpful[f.id]||0} helpful`)).join("")}</div></section>`;
  if(recent.length) html+=`<section class="learning-section"><h2>🆕 Recently Updated</h2><div class="recent-grid">${recent.map(f=>miniCard(f,`Updated ${formatDate(f.updated_at)}`)).join("")}</div></section>`;
  learningSections.innerHTML=html;
}
function miniCard(f,meta){return `<button class="mini-card" type="button" onclick="openStudyById(${JSON.stringify(f.id)})">${f.is_featured?'<span class="featured-ribbon">⭐ Featured</span>':''}<h3>${esc(f.question)} ${isStudied(f.id)?'<span class="studied-tag">✓ Studied</span>':''}</h3><p>${esc(meta)}</p></button>`}
window.selectLearningCategory=function(c){selectedCategory=c;renderCategories();renderFAQs();window.scrollTo({top:document.querySelector(".controls")?.offsetTop||0,behavior:"smooth"})}

function filteredStudyFAQs(){let a=[...allFAQs];if(selectedCategory!=="all")a=a.filter(f=>String(f.category||"").trim()===selectedCategory);const q=searchText.trim().toLowerCase();if(q)a=a.filter(f=>(String(f.question||"")+" "+String(f.answer||"").replace(/<[^>]*>/g," ")+" "+String(f.category||"")).toLowerCase().includes(q));return a}
function updateProgress(){const max=studyContent.scrollHeight-studyContent.clientHeight;const pct=max>0?Math.min(100,(studyContent.scrollTop/max)*100):100;studyProgress.style.width=pct+"%";studyProgress.setAttribute("aria-valuenow",Math.round(pct))}
function applyStudySettings(){
  dialog.classList.remove("study-theme-normal","study-theme-sepia","study-theme-dark");
  dialog.classList.add("study-theme-"+studyTheme);
  studyContent.style.fontSize=studyFontSize+"px";
  studyContent.classList.toggle("study-wide",studyMode);
  document.querySelectorAll("[data-theme]").forEach(b=>b.classList.toggle("active",b.dataset.theme===studyTheme));
  document.getElementById("studyModeBtn").classList.toggle("active",studyMode);
  localStorage.setItem("faqStudyFontSize",studyFontSize);localStorage.setItem("faqStudyTheme",studyTheme);
}
async function trackView(id){
  const key="faqView:"+id; const last=Number(localStorage.getItem(key)||0);
  if(Date.now()-last<30*60*1000)return;
  localStorage.setItem(key,String(Date.now()));
  try{await supabaseClient.from("faq_views").insert({faq_id:id,session_id:sessionId})}catch(e){console.warn("View tracking unavailable:",e)}
}
async function sendFeedback(id,val){
  const key="faqFeedback:"+id; if(localStorage.getItem(key))return alert("You have already submitted feedback for this FAQ.");
  try{
    const {error}=await supabaseClient.from("faq_feedback").insert({faq_id:id,is_helpful:val,session_id:sessionId});
    if(error)throw error; localStorage.setItem(key,String(val)); alert(val?"Thanks! Your feedback was recorded.":"Thanks for the feedback.");
  }catch(e){console.warn(e);alert("Feedback could not be saved right now.")}
}
function openStudyById(id){const a=filteredStudyFAQs();let i=a.findIndex(f=>String(f.id)===String(id));if(i<0){i=allFAQs.findIndex(f=>String(f.id)===String(id));if(i<0)return; currentStudyIndex=allFAQs.length?i:0; openStudy(currentStudyIndex,allFAQs)}else openStudy(i,a)}
function openStudy(index,list=filteredStudyFAQs()){
  if(!list.length)return;
  currentStudyIndex=Math.max(0,Math.min(index,list.length-1));const f=list[currentStudyIndex];
  studyQuestion.textContent=f.question||"";studyCategory.textContent=f.category||"Uncategorized";studyCategory.style.display=f.category?"inline-block":"none";
  studyContent.innerHTML=f.answer||"<p>No answer available.</p>";studyContent.scrollTop=0;updateProgress();applyStudySettings();
  modal.classList.add("show");modal.setAttribute("aria-hidden","false");document.body.classList.add("modal-open");dialog.setAttribute("data-faq-id",f.id);
  trackView(f.id);document.getElementById("prevFaqBtn").disabled=currentStudyIndex<=0;document.getElementById("nextFaqBtn").disabled=currentStudyIndex>=list.length-1;
  document.getElementById("studiedBtn").textContent=isStudied(f.id)?"✓ Studied":"✓ Studied";setTimeout(()=>studyContent.focus(),80);
  history.replaceState(null,"",`faqs.html?faq=${encodeURIComponent(f.id)}`);
}
function closeStudy(){modal.classList.remove("show");modal.setAttribute("aria-hidden","true");document.body.classList.remove("modal-open");history.replaceState(null,"",location.pathname+location.hash)}
function navigateStudy(delta){const list=filteredStudyFAQs();const ni=currentStudyIndex+delta;if(ni>=0&&ni<list.length)openStudy(ni,list)}
document.getElementById("studyClose").onclick=closeStudy;document.getElementById("closeStudyFooter").onclick=closeStudy;
modal.addEventListener("click",e=>{if(e.target===modal)closeStudy()});studyContent.addEventListener("scroll",updateProgress);
document.getElementById("prevFaqBtn").onclick=()=>navigateStudy(-1);document.getElementById("nextFaqBtn").onclick=()=>navigateStudy(1);
document.getElementById("studyModeBtn").onclick=()=>{studyMode=!studyMode;applyStudySettings()};
document.querySelectorAll("[data-font]").forEach(b=>b.onclick=()=>{const d=Number(b.dataset.font);studyFontSize=d===0?16:Math.max(13,Math.min(25,studyFontSize+d*2));applyStudySettings()});
document.querySelectorAll("[data-theme]").forEach(b=>b.onclick=()=>{studyTheme=b.dataset.theme;applyStudySettings()});
document.getElementById("copyAnswerBtn").onclick=async()=>{try{await navigator.clipboard.writeText(studyContent.innerText);alert("Copied successfully!")}catch{alert("Copy failed. Please try again.")}};
document.getElementById("shareFaqBtn").onclick=async()=>{const id=dialog.dataset.faqId;const url=new URL(`faqs.html?faq=${encodeURIComponent(id)}`,location.href).href;try{if(navigator.share)await navigator.share({title:studyQuestion.textContent,url});else{await navigator.clipboard.writeText(url);alert("Share URL copied!");}}catch(e){}};
document.getElementById("printFaqBtn").onclick=()=>window.print();
document.getElementById("helpfulBtn").onclick=()=>sendFeedback(dialog.dataset.faqId,true);
document.getElementById("notHelpfulBtn").onclick=()=>sendFeedback(dialog.dataset.faqId,false);
document.getElementById("studiedBtn").onclick=()=>{markStudied(dialog.dataset.faqId);alert("Marked as studied ✓");renderFAQs();renderLearningSections()};
document.addEventListener("keydown",e=>{if(!modal.classList.contains("show"))return;if(e.key==="Escape")closeStudy();if(e.key==="ArrowLeft")navigateStudy(-1);if(e.key==="ArrowRight")navigateStudy(1)});
const originalRenderFAQs=renderFAQs;
renderFAQs=function(){
  originalRenderFAQs();
  setTimeout(()=>{document.querySelectorAll(".question").forEach((q,i)=>{q.onclick=function(){const list=filteredStudyFAQs();const f=list.find(x=>String(x.id)===String(q.closest(".faq")?.dataset.id))||list[i];if(f)openStudy(list.indexOf(f)>=0?list.indexOf(f):i,list)}})},0);
  setTimeout(()=>{document.querySelectorAll(".faq").forEach((el,i)=>{const f=filteredStudyFAQs()[i];if(f)el.dataset.id=f.id;const q=el.querySelector(".question");if(q)q.setAttribute("role","button")})},0);
  const state=document.querySelector("#faqContainer .state");if(state&&searchText.trim()){state.innerHTML=`<h3>No matching FAQ found</h3><p>Try another keyword or browse the categories below.</p><div class="no-results-actions"><button class="clear-search-btn" onclick="document.getElementById('searchInput').value='';searchText='';renderFAQs()">Clear Search</button></div>`}
  renderLearningSections();
}
const oldLoadFAQs=loadFAQs;
loadFAQs=async function(){await oldLoadFAQs();await renderLearningSections();const p=new URLSearchParams(location.search).get("faq");if(p){const f=allFAQs.find(x=>String(x.id)===String(p));if(f)openStudyById(f.id)}}


/* ==========================================
   INITIAL LOAD
========================================== */

loadFAQs();

</script>
