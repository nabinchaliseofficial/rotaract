<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strategic Planning | Rotaract Club of Galkot Baglung</title>
    <!-- Font Links -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Icon Library -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        /* --- Color Palette & Variable Definitions --- */
        :root {
            --primary: #003366;       /* Deep Navy Blue */
            --secondary: #D4AF37;     /* Rotary Gold */
            --accent: #008080;        /* Teal for Success/Actions */
            --dark: #1E293B;          /* Charcoal text */
            --light-bg: #F8FAFC;      /* Soft light background */
            --card-bg: #FFFFFF;       /* Pure white for cards */
            --border-color: #E2E8F0;  /* Subtle lines */
            --text-muted: #64748B;    /* Lighter text for secondary data */
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 20px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            --shadow-lg: 0 10px 25px -5px rgba(0, 33, 102, 0.08);
        }

        /* --- Reset & Global Typography --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--light-bg);
            color: var(--dark);
            line-height: 1.6;
            overflow-x: hidden;
        }

        h1, h2, h3, h4 {
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
        }

        /* --- Navigation Bar --- */
        .navbar {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: var(--shadow);
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            color: var(--primary);
            text-decoration: none;
            font-size: 1.1rem;
        }

        .nav-logo i {
            color: var(--secondary);
            font-size: 1.4rem;
        }

        .home-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: var(--primary);
            color: var(--card-bg);
            padding: 0.6rem 1.2rem;
            border-radius: var(--radius-sm);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
            border: none;
            cursor: pointer;
        }

        .home-btn:hover {
            background-color: #002244;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 51, 102, 0.2);
        }

        /* Ripple effect styles */
        .ripple {
            position: absolute;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            transform: scale(0);
            animation: ripple-animation 0.5s linear;
            pointer-events: none;
        }

        @keyframes ripple-animation {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }

        /* --- Modern Hero Section --- */
        .hero {
            background: linear-gradient(135deg, var(--primary) 0%, #001F4D 100%);
            color: var(--card-bg);
            padding: 5rem 2rem;
            text-align: center;
            position: relative;
        }

        .hero::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 40px;
            background: var(--light-bg);
            clip-path: polygon(0 100%, 100% 100%, 100% 0);
        }

        .hero-content {
            max-width: 800px;
            margin: 0 auto;
        }

        .hero h1 {
            font-size: 2.8rem;
            margin-bottom: 1rem;
            letter-spacing: -0.5px;
            line-height: 1.2;
        }

        .hero h1 span {
            color: var(--secondary);
        }

        .hero p {
            font-size: 1.2rem;
            opacity: 0.9;
            font-weight: 300;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* --- Main Layout Wrapper --- */
        .main-container {
            max-width: 1200px;
            margin: -2rem auto 5rem auto;
            padding: 0 2rem;
            position: relative;
            z-index: 10;
        }

        /* --- Vision & Mission Cards --- */
        .vision-mission-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 2rem;
            margin-bottom: 4rem;
        }

        .vm-card {
            background: var(--card-bg);
            padding: 2.5rem;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            border-top: 5px solid var(--primary);
            transition: var(--transition);
        }

        .vm-card:hover {
            transform: translateY(-5px);
        }

        .vm-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 1.2rem;
        }

        .vm-header i {
            font-size: 1.6rem;
            color: var(--primary);
        }

        .vm-header h3 {
            font-size: 1.4rem;
            color: var(--dark);
        }

        .vm-card p {
            color: var(--text-muted);
            font-style: italic;
            font-size: 1.05rem;
        }

        /* --- Section Titles --- */
        .section-title {
            text-align: center;
            font-size: 2rem;
            color: var(--primary);
            margin: 4rem 0 2rem 0;
            position: relative;
        }

        .section-title::after {
            content: '';
            display: block;
            width: 50px;
            height: 4px;
            background-color: var(--secondary);
            margin: 0.5rem auto 0 auto;
            border-radius: 2px;
        }

        /* --- Club Goals Cards Grid --- */
        .goals-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
        }

        .goal-card {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow);
            border-left: 4px solid var(--secondary);
            transition: var(--transition);
        }

        .goal-card:hover {
            box-shadow: var(--shadow-lg);
            transform: scale(1.02);
        }

        .goal-card .goal-stat {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .goal-card .goal-stat i {
            color: var(--secondary);
            font-size: 1.4rem;
        }

        .goal-card p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        /* --- Success Criteria (within Goal Cards) --- */
        .goal-card .sc-heading {
            font-weight: 700;
            color: var(--primary);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            margin-top: 1.2rem;
            margin-bottom: 0.6rem;
        }

        .goal-card .sc-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .goal-card .sc-list li {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            font-size: 0.88rem;
            color: var(--dark);
        }

        .goal-card .sc-list li i {
            color: var(--accent);
            font-size: 0.9rem;
            margin-top: 3px;
            flex-shrink: 0;
        }

        .goal-card .sc-list li.sc-completed {
            color: var(--text-muted);
        }

        .goal-card .sc-list li.sc-completed span {
            text-decoration: line-through;
        }

        .goal-card .sc-list li:not(.sc-completed) i {
            color: var(--border-color);
        }

        .loading-state, .error-state {
            text-align: center;
            padding: 2rem;
            color: var(--text-muted);
        }
        .error-state { color: #DC2626; }

        /* --- Footer Section --- */
        footer {
            text-align: center;
            padding: 3rem 2rem;
            margin-top: 5rem;
            background-color: var(--primary);
            color: var(--card-bg);
            font-size: 0.95rem;
            opacity: 0.95;
        }

        /* --- Responsive Queries --- */
        @media (max-width: 768px) {
            .hero h1 { font-size: 2.2rem; }
            .hero p { font-size: 1rem; }
            .nav-container { padding: 1rem; }
        }
    </style>
</head>
<body>

    <!-- Professional Top Navigation Bar -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="#" class="nav-logo">
                <i class="fa-solid fa-circle-nodes"></i> Rotaract Galkot Baglung
            </a>
            <a href="index.html" class="home-btn" id="interactiveHomeBtn">
                <i class="fa-solid fa-house"></i> HOME
            </a>
        </div>
    </nav>

    <!-- Modern Animated Hero Section -->
    <header class="hero">
        <div class="hero-content">
            <h1>Rotaract Club of <span>Galkot Baglung</span></h1>
            <p id="heroSubtitle">Loading...</p>
        </div>
    </header>

    <!-- Core Page Metrics Layout Wrapper -->
    <main class="main-container">

        <!-- Vision -->
        <section class="vision-mission-grid">
            <div class="vm-card">
                <div class="vm-header">
                    <i class="fa-solid fa-eye"></i>
                    <h3>Our Vision</h3>
                </div>
                <p id="visionText">Loading...</p>
            </div>
        </section>

        <!-- Club Goals Area Grid -->
        <section>
            <h2 class="section-title">Club Goals (RY 2026-27)</h2>
            <div class="goals-grid" id="goalsGrid"></div>
        </section>

    </main>

    <!-- Professional Footer Summary -->
    <footer>
        <p>&copy; 2026 Rotaract Club of Galkot Baglung. All Rights Reserved.</p>
    </footer>

    <!-- Interactive UI Control Elements Scripting -->
    <script>
        // ---- Supabase Setup ----
        const SUPABASE_URL = "https://kbyfvqkfcxqgjjtfvvxf.supabase.co";
        const SUPABASE_KEY = "sb_publishable_-bOiDndDXdz_FgXq1MFkag_ioCcg8nv";
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        function escapeHtml(str) {
            const d = document.createElement('div');
            d.innerText = str ?? '';
            return d.innerHTML;
        }

        async function loadStrategicPlan() {
            const { data, error } = await sb
                .from('strategic_planning')
                .select('data')
                .eq('id', 1)
                .single();

            if (error || !data) {
                document.querySelector('.main-container').innerHTML =
                    '<div class="error-state"><i class="fa-solid fa-triangle-exclamation"></i> Could not load strategic planning content. Please try again later.</div>';
                console.error(error);
                return;
            }

            renderPlan(data.data);
        }

        function renderPlan(plan) {
            // Hero subtitle
            document.getElementById('heroSubtitle').innerText = plan.hero_subtitle || '';

            // Vision
            document.getElementById('visionText').innerText = `"${plan.vision || ''}"`;

            // Goals
            const goalsGrid = document.getElementById('goalsGrid');
            goalsGrid.innerHTML = '';
            (plan.goals || []).forEach(g => {
                const card = document.createElement('div');
                card.className = 'goal-card';
                const criteria = g.success_criteria || [];
                const criteriaHtml = criteria.length ? `
                    <div class="sc-heading">Success Criteria</div>
                    <ul class="sc-list">
                        ${criteria.map(c => {
                            const item = (typeof c === 'string') ? { text: c, completed: false } : c;
                            const isDone = !!item.completed;
                            return `<li class="${isDone ? 'sc-completed' : ''}">
                                <i class="fa-solid ${isDone ? 'fa-square-check' : 'fa-square'}"></i>
                                <span>${escapeHtml(item.text)}</span>
                            </li>`;
                        }).join('')}
                    </ul>` : '';
                card.innerHTML = `
                    <div class="goal-stat"><i class="${escapeHtml(g.icon || 'fa-solid fa-bullseye')}"></i> ${escapeHtml(g.stat)}</div>
                    <h3>${escapeHtml(g.title)}</h3>
                    <p>${escapeHtml(g.description)}</p>
                    ${criteriaHtml}`;
                goalsGrid.appendChild(card);
            });
        }

        // Professional Material Ripple Button Navigation Sequence
        document.getElementById('interactiveHomeBtn').addEventListener('click', function(e) {
            e.preventDefault();
            const targetUrl = this.getAttribute('href');
            const button = this;

            const ripple = document.createElement('span');
            ripple.classList.add('ripple');
            
            const rect = button.getBoundingClientRect();
            const size = Math.max(rect.width, rect.height);
            ripple.style.width = ripple.style.height = `${size}px`;
            ripple.style.left = `${e.clientX - rect.left - size / 2}px`;
            ripple.style.top = `${e.clientY - rect.top - size / 2}px`;
            
            button.appendChild(ripple);

            setTimeout(() => {
                window.location.href = targetUrl;
            }, 300);
        });

        // Init
        loadStrategicPlan();
    </script>
</body>
</html>
