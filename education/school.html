<html lang="en">
<head>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(145deg, #f4f8fe 0%, #e9eff6 100%);
      font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
      padding: 2rem 1.5rem;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      max-width: 1380px;
      width: 100%;
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(2px);
      border-radius: 40px 40px 30px 30px;
      padding: 2rem 1.8rem 2.5rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.20), inset 0 1px 2px rgba(255, 255, 255, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.6);
    }

    /* header */
    .header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      gap: 1rem 0.5rem;
    }

    .header h1 {
      font-size: 2rem;
      font-weight: 600;
      color: #0b2b44;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .header h1 i {
      color: #2563eb;
      background: white;
      padding: 8px 14px;
      border-radius: 60px;
      box-shadow: 0 6px 14px -6px rgba(37, 99, 235, 0.3);
      font-size: 1.7rem;
    }

    .search-wrapper {
      display: flex;
      align-items: center;
      background: white;
      padding: 0.2rem 0.2rem 0.2rem 1.2rem;
      border-radius: 60px;
      box-shadow: 0 8px 20px -10px rgba(0, 20, 40, 0.15);
      border: 1px solid rgba(0, 0, 0, 0.03);
      transition: all 0.2s;
      min-width: 220px;
    }

    .search-wrapper:focus-within {
      box-shadow: 0 8px 22px -6px #2563eb50;
      border-color: #2563eb70;
    }

    .search-wrapper i {
      color: #5b6f82;
      font-size: 1rem;
      margin-right: 6px;
    }

    .search-wrapper input {
      border: none;
      padding: 0.7rem 0.5rem 0.7rem 0;
      font-size: 0.95rem;
      background: transparent;
      width: 200px;
      outline: none;
      color: #1e2f3f;
      font-weight: 450;
    }

    .search-wrapper input::placeholder {
      color: #9aabb8;
      font-weight: 400;
    }

    .search-wrapper button {
      background: #2563eb;
      border: none;
      color: white;
      padding: 0.5rem 1.3rem;
      border-radius: 40px;
      font-weight: 500;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: 0.15s;
      letter-spacing: 0.3px;
      box-shadow: 0 6px 12px -6px #1d4ed8;
    }

    .search-wrapper button:hover {
      background: #1d4ed8;
      transform: scale(0.97);
    }

    .stat-badge {
      background: #e6edf5;
      padding: 0.4rem 1.2rem;
      border-radius: 40px;
      font-size: 0.9rem;
      font-weight: 500;
      color: #1e3a5f;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .stat-badge i {
      color: #2563eb;
    }

    /* table card */
    .table-responsive {
      overflow-x: auto;
      border-radius: 28px;
      background: white;
      padding: 0.1rem 0 0.1rem 0;
      box-shadow: 0 8px 30px -14px rgba(0, 20, 40, 0.18);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
      min-width: 780px;
      white-space: nowrap;
    }

    th {
      background: #f0f5fc;
      color: #1f3a5f;
      font-weight: 600;
      padding: 1rem 0.8rem;
      text-align: left;
      border-bottom: 2px solid #dce5ef;
      letter-spacing: 0.3px;
      font-size: 0.78rem;
      text-transform: uppercase;
    }

    td {
      padding: 0.9rem 0.8rem;
      border-bottom: 1px solid #e9eff5;
      color: #1f2e3f;
      vertical-align: middle;
      background-color: white;
      transition: background 0.1s;
    }

    tr:last-child td {
      border-bottom: none;
    }

    tr:hover td {
      background: #f8fcff;
    }

    td:first-child {
      font-weight: 500;
      color: #0f2b44;
    }

    .school-name {
      font-weight: 600;
      color: #0b2b44;
      letter-spacing: -0.2px;
    }

    .email-link {
      color: #1f5b9e;
      text-decoration: none;
      font-weight: 450;
      border-bottom: 1px dotted #b3c9e0;
    }

    .email-link:hover {
      color: #0b3b7a;
      border-bottom: 1px solid #2563eb;
    }

    .phone {
      font-weight: 500;
      color: #1f4b6e;
      letter-spacing: 0.2px;
    }

    .empty-row td {
      text-align: center;
      padding: 3rem 0;
      color: #5b6f82;
      font-style: italic;
      background: #fafdff;
    }

    .footer-note {
      margin-top: 1.8rem;
      display: flex;
      justify-content: flex-end;
      color: #3d5a78;
      font-size: 0.85rem;
      padding-right: 0.5rem;
      gap: 1.2rem;
      flex-wrap: wrap;
    }

    .footer-note i {
      color: #2563eb;
      margin-right: 4px;
    }

    @media (max-width: 700px) {
      .container {
        padding: 1.2rem 0.8rem;
      }
      .header h1 {
        font-size: 1.5rem;
        flex-wrap: wrap;
      }
      .search-wrapper {
        width: 100%;
      }
      .search-wrapper input {
        width: 100%;
      }
      .stat-badge {
        font-size: 0.75rem;
      }
    }
  </style>
</head>

    // -------- render --------
    const tbody = document.getElementById('tableBody');
    const countSpan = document.getElementById('countDisplay');
    const searchInput = document.getElementById('searchInput');
    const clearBtn = document.getElementById('clearBtn');

    function renderTable(filterText = '') {
      const lowerFilter = filterText.toLowerCase().trim();
      let filtered = schoolsData;

      if (lowerFilter !== '') {
        filtered = schoolsData.filter(row => {
          // search all displayed fields: school, email, address, phone (skip index)
          const searchable = row.slice(1).join(' ').toLowerCase();
          return searchable.includes(lowerFilter);
        });
      }

      countSpan.textContent = filtered.length;

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr class="empty-row"><td colspan="5"><i class="fas fa-search" style="margin-right: 10px;"></i> No schools match your search.</td></tr>`;
        return;
      }

      let html = '';
      filtered.forEach(row => {
        const [sno, school, email, address, phone] = row;
        const displayPhone = (phone && phone.length > 0 && phone !== '`') ? phone : '—';
        html += `<tr>
          <td><strong>${sno}</strong></td>
          <td class="school-name">${school}</td>
          <td><a href="mailto:${email}" class="email-link" title="${email}">${email}</a></td>
          <td>${address}</td>
          <td class="phone">${displayPhone}</td>
        </tr>`;
      });

      tbody.innerHTML = html;
    }

    // -------- event binding --------
    function handleSearch() {
      renderTable(searchInput.value);
    }

    searchInput.addEventListener('input', handleSearch);

    clearBtn.addEventListener('click', function() {
      searchInput.value = '';
      renderTable('');
      searchInput.focus();
    });

    searchInput.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        searchInput.value = '';
        renderTable('');
        searchInput.blur();
      }
    });

    // initial render
    renderTable('');
  })();
