<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rotaract Club - LHE Verification</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/dist/umd/supabase.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --magenta: #D91B5C;
            --magenta-dark: #B5154C;
            --magenta-light: #FCE4EC;
            --magenta-glow: rgba(217, 27, 92, 0.12);
            --blue-dark: #0B1E30;
            --blue-mid: #1A3A5C;
            --gray-100: #F8FAFC;
            --gray-200: #E9EDF4;
            --gray-300: #D0D9E8;
            --gray-400: #8A9BB0;
            --gray-500: #6B7A93;
            --gray-600: #4A5A72;
            --gray-700: #1E3146;
            --white: #FFFFFF;
            --success: #1E8B4C;
            --success-bg: #E6F7EE;
            --error: #B13A2E;
            --error-bg: #FEF0EE;
            --shadow-card: 0 20px 60px rgba(0, 20, 40, 0.08);
            --radius-lg: 28px;
            --radius-md: 16px;
            --radius-sm: 12px;
            --transition: 0.25s ease;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: #F4F7FB;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1.5rem 1rem;
        }

        .app {
            max-width: 1000px;
            width: 100%;
            background: var(--white);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-card);
            overflow: hidden;
        }

        /* ─── Header ──────────────────────────────────────────────────────────────── */
        .app-header {
            background: linear-gradient(135deg, var(--blue-dark) 0%, var(--blue-mid) 100%);
            padding: 1rem 2rem;
            color: var(--white);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
            border-bottom: 4px solid var(--magenta);
        }

        .app-header .logo-wrap {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .app-header .logo-wrap .logo-img {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--magenta);
        }

        .app-header .club-info h1 {
            font-size: 1rem;
            font-weight: 700;
        }

        .app-header .club-info .sub {
            font-size: 0.7rem;
            opacity: 0.8;
        }

        .app-header .badge {
            background: rgba(255, 255, 255, 0.10);
            padding: 0.3rem 1.2rem;
            border-radius: 40px;
            font-size: 0.7rem;
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .app-header .badge .live-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #4ADE80;
            border-radius: 50%;
            animation: pulse-dot 1.8s ease-in-out infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.8); }
        }

        .app-header .nav-links {
            display: flex;
            gap: 0.8rem;
            align-items: center;
        }

        .app-header .nav-links a {
            color: rgba(255,255,255,0.7);
            text-decoration: none;
            font-size: 0.75rem;
            padding: 0.25rem 1rem;
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.15);
            transition: all var(--transition);
        }

        .app-header .nav-links a:hover {
            background: rgba(255,255,255,0.1);
            color: var(--white);
        }

        /* ─── Status Section ──────────────────────────────────────────────────────── */
        .status-section {
            padding: 1.5rem 2rem;
            background: var(--gray-100);
            border-bottom: 1px solid var(--gray-200);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.6rem;
        }

        .status-section .loader {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            font-size: 0.9rem;
            color: var(--gray-500);
        }

        .status-section .loader .spinner {
            width: 24px;
            height: 24px;
            border: 3px solid var(--gray-200);
            border-top: 3px solid var(--magenta);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .verify-banner {
            width: 100%;
            padding: 0.8rem 1.2rem;
            border-radius: var(--radius-sm);
            display: none;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
            border-left: 5px solid;
        }

        .verify-banner.visible {
            display: flex;
        }

        .verify-banner.success {
            background: var(--success-bg);
            border-color: var(--success);
            color: var(--success);
        }

        .verify-banner.error {
            background: var(--error-bg);
            border-color: var(--error);
            color: var(--error);
        }

        .verify-banner .banner-icon {
            font-size: 1.8rem;
            flex-shrink: 0;
        }

        .verify-banner .banner-text {
            flex: 1;
        }

        .verify-banner .banner-text .banner-title {
            font-weight: 700;
            font-size: 0.95rem;
        }

        .verify-banner .banner-text .banner-sub {
            font-weight: 400;
            font-size: 0.8rem;
            opacity: 0.8;
        }

        /* ─── Result Section ──────────────────────────────────────────────────────── */
        .result-section {
            padding: 1.5rem 2rem 2rem;
            display: none;
            animation: fadeUp 0.4s ease;
        }

        .result-section.visible {
            display: block;
        }

        @keyframes fadeUp {
            0% { opacity: 0; transform: translateY(16px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .letter-card {
            background: var(--white);
            border: 1px solid var(--gray-200);
            border-radius: var(--radius-md);
            padding: 2rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.02);
            position: relative;
        }

        .letter-card .verified-stamp {
            position: absolute;
            top: 1rem;
            right: 1.5rem;
            background: var(--success-bg);
            color: var(--success);
            padding: 0.2rem 1rem;
            border-radius: 40px;
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            border: 1px solid #C5E0D0;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            text-transform: uppercase;
        }

        .letter-card .verified-stamp .dot-green {
            display: inline-block;
            width: 7px;
            height: 7px;
            background: var(--success);
            border-radius: 50%;
        }

        .letter-card .letter-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 0.8rem;
            border-bottom: 2px solid var(--gray-100);
            padding-bottom: 0.8rem;
            margin-bottom: 1rem;
        }

        .letter-card .letter-header .org .name {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--blue-dark);
        }

        .letter-card .letter-header .org .sub {
            font-size: 0.75rem;
            color: var(--gray-400);
        }

        .letter-card .letter-header .org .logo-thumb {
            max-height: 40px;
            max-width: 60px;
            object-fit: contain;
            margin-top: 0.2rem;
            border-radius: 4px;
        }

        .letter-card .letter-header .ref-badge {
            background: var(--magenta-light);
            padding: 0.2rem 1rem;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--magenta-dark);
            border: 1px solid rgba(217, 27, 92, 0.15);
            white-space: nowrap;
        }

        .letter-card .letter-body {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
        }

        .letter-card .letter-body .to-line {
            font-size: 0.88rem;
            line-height: 1.8;
            color: var(--gray-700);
            white-space: pre-wrap;
            text-align: justify;
        }

        .letter-card .letter-body .to-line strong {
            font-weight: 600;
            color: var(--blue-dark);
        }

        .letter-card .letter-body .subject {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--blue-dark);
            background: var(--gray-100);
            padding: 0.5rem 1rem;
            border-radius: var(--radius-sm);
            border-left: 4px solid var(--magenta);
            line-height: 1.5;
            text-align: center;
        }

        .letter-card .letter-body .body-text {
            white-space: pre-wrap;
            line-height: 1.8;
            font-size: 0.88rem;
            color: var(--gray-700);
            margin: 0.2rem 0;
            text-align: justify;
        }

        .letter-card .letter-body .ref-date-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.3rem;
            font-size: 0.85rem;
            color: var(--gray-700);
            margin-top: 0.2rem;
        }

        .letter-card .letter-body .details-grid {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 0.15rem 1.5rem;
            margin-top: 0.4rem;
            font-size: 0.82rem;
            color: var(--gray-700);
            border-top: 1px solid var(--gray-100);
            padding-top: 0.6rem;
        }

        .letter-card .letter-body .details-grid .label {
            font-weight: 600;
            color: var(--gray-500);
            white-space: nowrap;
        }

        .letter-card .letter-body .details-grid .value .status-badge {
            display: inline-block;
            padding: 0.05rem 0.7rem;
            border-radius: 20px;
            font-size: 0.68rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .letter-card .letter-body .details-grid .value .status-badge.active {
            background: var(--success-bg);
            color: var(--success);
        }

        /* ─── Signatures ──────────────────────────────────────────────────────────── */
        .letter-card .letter-signature {
            margin-top: 1.5rem;
            border-top: 1px solid var(--gray-200);
            padding-top: 1rem;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .letter-card .letter-signature .sig-block {
            flex: 1;
            min-width: 100px;
            text-align: center;
        }

        .letter-card .letter-signature .sig-block .sig-img {
            max-height: 50px;
            object-fit: contain;
            display: block;
            margin: 0 auto 0.1rem;
        }

        .letter-card .letter-signature .sig-block .sig-name {
            font-weight: 600;
            font-size: 0.85rem;
        }

        .letter-card .letter-signature .sig-block .sig-title {
            font-size: 0.72rem;
            color: var(--gray-500);
        }

        .letter-card .letter-signature .sig-center {
            text-align: center;
            flex: 1;
            min-width: 100px;
        }

        .letter-card .letter-signature .sig-center .sig-label {
            font-weight: 600;
            font-size: 0.85rem;
            margin-bottom: 0.15rem;
        }

        .letter-card .letter-signature .sig-center .sig-img {
            max-height: 50px;
            object-fit: contain;
            display: block;
            margin: 0 auto 0.1rem;
        }

        .letter-card .letter-signature .sig-center .sig-name {
            font-weight: 600;
            font-size: 0.85rem;
        }

        .letter-card .letter-signature .sig-center .sig-title {
            font-size: 0.72rem;
            color: var(--gray-500);
        }

        .letter-card .letter-signature .sig-right {
            text-align: right;
            flex: 1;
            min-width: 100px;
        }

        .letter-card .letter-signature .sig-right .sig-img {
            max-height: 50px;
            object-fit: contain;
            display: block;
            margin: 0 0 0.1rem auto;
        }

        .letter-card .letter-signature .sig-right .sig-name {
            font-weight: 600;
            font-size: 0.85rem;
        }

        .letter-card .letter-signature .sig-right .sig-title {
            font-size: 0.72rem;
            color: var(--gray-500);
        }

        .letter-card .letter-place {
            text-align: center;
            font-size: 0.8rem;
            color: var(--gray-500);
            margin-top: 0.3rem;
        }

        /* ─── Footer Area ──────────────────────────────────────────────────────────── */
        .letter-card .letter-footer-area {
            margin-top: 1rem;
            padding-top: 0.8rem;
            border-top: 1px solid var(--gray-200);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .letter-card .letter-footer-area .footer-text {
            font-size: 0.75rem;
            color: var(--gray-400);
        }

        .letter-card .letter-footer-area .stamp {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--magenta);
            font-weight: 600;
            font-size: 0.75rem;
        }

        .letter-card .letter-footer-area .stamp .dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            background: var(--magenta);
            border-radius: 50%;
            opacity: 0.4;
        }

        /* ─── QR Section ──────────────────────────────────────────────────────────── */
        .letter-card .qr-section {
            margin-top: 1rem;
            padding-top: 0.8rem;
            border-top: 1px solid var(--gray-200);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.2rem;
        }

        .letter-card .qr-section .qr-label {
            font-size: 0.65rem;
            color: var(--gray-400);
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .letter-card .qr-section .qr-box {
            width: 120px;
            height: 120px;
            background: var(--white);
            border: 1px solid var(--gray-200);
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6px;
        }

        .letter-card .qr-section .qr-box canvas,
        .letter-card .qr-section .qr-box img {
            width: 100% !important;
            height: 100% !important;
        }

        .letter-card .qr-section .qr-url {
            font-size: 0.6rem;
            color: var(--gray-400);
            word-break: break-all;
            text-align: center;
            max-width: 100%;
        }

        /* ─── No Data ────────────────────────────────────────────────────────────── */
        .no-data {
            text-align: center;
            padding: 2rem 1rem;
            color: var(--gray-400);
        }

        .no-data .icon-big {
            font-size: 2.5rem;
            margin-bottom: 0.6rem;
            display: block;
        }

        .no-data p {
            font-size: 0.9rem;
        }

        /* ─── Action Buttons ────────────────────────────────────────────────────── */
        .action-buttons {
            display: flex;
            gap: 0.6rem;
            flex-wrap: wrap;
            margin-top: 1rem;
        }

        .action-buttons .btn-action {
            padding: 0.35rem 1.2rem;
            border: 1.5px solid var(--gray-200);
            border-radius: 40px;
            background: var(--white);
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--gray-600);
            cursor: pointer;
            transition: all var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            font-family: inherit;
        }

        .action-buttons .btn-action:hover {
            border-color: var(--magenta);
            color: var(--magenta);
            background: var(--magenta-light);
        }

        .action-buttons .btn-action.primary {
            background: var(--magenta);
            border-color: var(--magenta);
            color: var(--white);
        }

        .action-buttons .btn-action.primary:hover {
            background: var(--magenta-dark);
            border-color: var(--magenta-dark);
        }

        /* ─── Footer ────────────────────────────────────────────────────────────────── */
        .app-footer {
            background: var(--blue-dark);
            color: rgba(255, 255, 255, 0.7);
            padding: 0.8rem 2rem;
            font-size: 0.7rem;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.5rem;
            border-top: 3px solid var(--magenta);
        }

        /* ─── Responsive ───────────────────────────────────────────────────────────── */
        @media (max-width: 768px) {
            .app-header {
                padding: 0.8rem 1rem;
                flex-direction: column;
                align-items: stretch;
            }
            .app-header .nav-links {
                flex-wrap: wrap;
            }
            .status-section {
                padding: 1rem;
            }
            .result-section {
                padding: 1rem;
            }
            .letter-card {
                padding: 1rem;
            }
            .letter-card .verified-stamp {
                position: relative;
                top: auto;
                right: auto;
                align-self: flex-start;
                margin-bottom: 0.5rem;
            }
            .letter-card .letter-header {
                flex-direction: column;
                align-items: flex-start;
            }
            .letter-card .letter-signature {
                flex-direction: column;
                align-items: stretch !important;
            }
            .letter-card .letter-signature .sig-block,
            .letter-card .letter-signature .sig-center,
            .letter-card .letter-signature .sig-right {
                text-align: center !important;
            }
            .letter-card .letter-signature .sig-right .sig-img {
                margin: 0 auto 0.1rem !important;
            }
            .letter-card .letter-body .details-grid {
                grid-template-columns: 1fr;
                gap: 0.1rem;
            }
            .letter-card .letter-body .details-grid .label {
                white-space: normal;
            }
            .letter-card .letter-footer-area {
                flex-direction: column;
                align-items: flex-start;
            }
            .app-footer {
                padding: 0.8rem 1rem;
                flex-direction: column;
                align-items: flex-start;
            }
            .letter-card .qr-section .qr-box {
                width: 100px;
                height: 100px;
            }
        }

        @media (max-width: 480px) {
            .letter-card .qr-section .qr-box {
                width: 80px;
                height: 80px;
            }
        }

        @media print {
            .no-print { display: none !important; }
            body { padding: 0 !important; background: white !important; }
            .app { box-shadow: none !important; border-radius: 0 !important; }
            .letter-card { border: none !important; padding: 1rem !important; box-shadow: none !important; }
            .letter-card .verified-stamp { position: static !important; align-self: flex-start; margin-bottom: 0.5rem; }
            .action-buttons { display: none !important; }
            .result-section { padding: 1rem !important; }
            .letter-card .qr-section .qr-box { width: 140px !important; height: 140px !important; }
            .letter-card .letter-body .subject { text-align: center !important; }
            .letter-card .letter-body .ref-date-row { display: flex !important; justify-content: space-between !important; }
            .letter-card .letter-signature { display: flex !important; justify-content: space-between !important; }
        }
    </style>
</head>
<body>

    <div class="app">

        <!-- ─── HEADER ────────────────────────────────────────────────────────────── -->
        <header class="app-header no-print">
            <div class="logo-wrap">
                <img src="rotaract.jpg" alt="Rotaract Logo" class="logo-img" onerror="this.style.display='none'" />
                <div class="club-info">
                    <h1>ROTARACT CLUB OF GALKOT BAGLUNG</h1>
                    <div class="sub">RI District 3292 • Nepal • 🔐 LHE Verification</div>
                </div>
            </div>
            <div class="badge">
                <span class="live-dot"></span>
                <span>Live • Verified</span>
            </div>
            <div class="nav-links">
                <a href="/index.html">🏠 Home</a>
            </div>
        </header>

        <!-- ─── STATUS SECTION ────────────────────────────────────────────────────── -->
        <section class="status-section no-print">
            <div id="loader" class="loader">
                <div class="spinner"></div>
                <span id="loaderText">🔍 Searching for LHE document...</span>
            </div>
            <div id="verifyBanner" class="verify-banner">
                <span class="banner-icon" id="bannerIcon">✅</span>
                <div class="banner-text">
                    <div class="banner-title" id="bannerTitle">Verified</div>
                    <div class="banner-sub" id="bannerSub">This LHE document has been verified through our system.</div>
                </div>
            </div>
        </section>

        <!-- ─── RESULT SECTION ────────────────────────────────────────────────────── -->
        <section class="result-section" id="resultSection">
            <div id="letterContainer"></div>
        </section>

        <!-- ─── FOOTER ────────────────────────────────────────────────────────────── -->
        <footer class="app-footer no-print">
            <span>© 2026 Rotaract Club of Galkot Baglung • RI District 3292</span>
            <span style="opacity:0.5;">LHE Verify v2.0</span>
        </footer>

    </div>

    <script>
        (function() {
            'use strict';

            const SUPABASE_URL = 'https://kbyfvqkfcxqgjjtfvvxf.supabase.co';
            const SUPABASE_ANON_KEY = 'sb_publishable_-bOiDndDXdz_FgXq1MFkag_ioCcg8nv';

            // ─── DOM Refs ──────────────────────────────────────────────────────────
            const loader = document.getElementById('loader');
            const loaderText = document.getElementById('loaderText');
            const verifyBanner = document.getElementById('verifyBanner');
            const bannerIcon = document.getElementById('bannerIcon');
            const bannerTitle = document.getElementById('bannerTitle');
            const bannerSub = document.getElementById('bannerSub');
            const resultSection = document.getElementById('resultSection');
            const letterContainer = document.getElementById('letterContainer');

            let supabaseClient = null;

            // ─── Init Supabase ─────────────────────────────────────────────────────
            try {
                if (typeof window.supabase !== 'undefined' && window.supabase.createClient) {
                    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                    console.log('✅ Supabase client initialized.');
                } else {
                    console.warn('⚠️ Supabase library not loaded.');
                }
            } catch (e) {
                console.error('❌ Failed to init Supabase:', e);
            }

            // ─── Utility ──────────────────────────────────────────────────────────
            function escapeHtml(text) {
                if (!text) return '';
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            function showBanner(icon, title, sub, type) {
                verifyBanner.className = 'verify-banner visible ' + type;
                bannerIcon.textContent = icon;
                bannerTitle.textContent = title;
                bannerSub.textContent = sub;
            }

            function hideBanner() {
                verifyBanner.className = 'verify-banner';
            }

            // ─── Render Letter ────────────────────────────────────────────────────
            function renderLetter(letter) {
                if (!letter) {
                    letterContainer.innerHTML = `
                        <div class="no-data">
                            <span class="icon-big">📄</span>
                            <p>Sorry, no active LHE document found for this verification ID.</p>
                            <p style="font-size:0.8rem;color:var(--gray-400);margin-top:0.3rem;">
                                The document may be inactive or does not exist in our records.
                            </p>
                        </div>
                    `;
                    resultSection.classList.add('visible');
                    return;
                }

                const dateDisplay = letter.date ? new Date(letter.date).toLocaleDateString('en-US', {
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric'
                }) : '—';

                const vid = letter.verification_id || `LHE-${letter.fiscal_year}-${letter.ref_no}`;
                const qrUrl = `https://galkot.netlify.app/verifyLHE.html?vid=${encodeURIComponent(vid)}`;

                // Build details
                const details = [
                    { label: 'Sender Club', value: letter.sender_club_name || '—' },
                    { label: 'Sender RID', value: letter.sender_rid || '—' },
                    { label: 'Recipient Club', value: letter.recipient_club_name || '—' },
                    { label: 'Recipient RID', value: letter.recipient_rid || '—' },
                    { label: 'Letter Type', value: letter.letter_type || 'LHE' },
                ];

                if (letter.sender_sponsored_club) {
                    details.push({ label: 'Sender Sponsored', value: letter.sender_sponsored_club });
                }
                if (letter.recipient_sponsored_club) {
                    details.push({ label: 'Recipient Sponsored', value: letter.recipient_sponsored_club });
                }

                details.push({
                    label: 'Status',
                    value: `<span class="status-badge active">✅ Active</span>`
                });

                const detailsHtml = details.map(d => `
                    <span class="label">${escapeHtml(d.label)}</span>
                    <span class="value">${d.value}</span>
                `).join('');

                // Signature HTML with proper styling - name above signature
                const sigHtml = `
                    <div class="letter-signature">
                        <div class="sig-block">
                            <div class="sig-name">${escapeHtml(letter.secretary_name || 'Secretary')}</div>
                            ${letter.secretary_signature_url ? `<img src="${letter.secretary_signature_url}" alt="Secretary Signature" class="sig-img" onerror="this.style.display='none'" />` : ''}
                            <div class="sig-title">Secretary RY 2026-27</div>
                        </div>
                        <div class="sig-center">
                            <div class="sig-label">Yours in Rotaract</div>
                            <div class="sig-name">${escapeHtml(letter.international_chair_name || 'International Chair')}</div>
                            ${letter.international_chair_signature_url ? `<img src="${letter.international_chair_signature_url}" alt="Chair Signature" class="sig-img" onerror="this.style.display='none'" />` : ''}
                            <div class="sig-title">International Service Chair (2026-27)</div>
                        </div>
                        <div class="sig-right">
                            <div class="sig-name">${escapeHtml(letter.president_name || 'President')}</div>
                            ${letter.president_signature_url ? `<img src="${letter.president_signature_url}" alt="President Signature" class="sig-img" onerror="this.style.display='none'" />` : ''}
                            <div class="sig-title">President RY 2026-27</div>
                        </div>
                    </div>
                `;

                const html = `
                    <div class="letter-card">
                        <div class="verified-stamp">
                            <span class="dot-green"></span> ✅ VERIFIED
                        </div>

                        <div class="letter-header">
                            <div class="org">
                                <span class="name">${escapeHtml(letter.sender_club_name || 'Rotaract Club')}</span>
                                <span class="sub">RID ${escapeHtml(letter.sender_rid || '—')} ${letter.sender_sponsored_club ? '• Sponsored: ' + escapeHtml(letter.sender_sponsored_club) : ''}</span>
                                ${letter.sender_logo_url ? `<img src="${letter.sender_logo_url}" alt="Club Logo" class="logo-thumb" onerror="this.style.display='none'" />` : ''}
                            </div>
                            <div class="ref-badge">
                                Ref. ${escapeHtml(letter.ref_no)} • F.Y. ${escapeHtml(letter.fiscal_year)}
                            </div>
                        </div>

                        <div class="letter-body">
                            <div class="to-line">
                                <strong>To:</strong>\n${escapeHtml(letter.recipient_name || '—')}, ${escapeHtml(letter.recipient_position || '—')}, ${escapeHtml(letter.recipient_club_name || '—')}
                            </div>

                            <div class="subject">
                                📌 ${escapeHtml(letter.subject || 'Letterhead Exchange')}
                            </div>

                            <div class="body-text">
                                ${escapeHtml(letter.body || '')}
                            </div>

                            ${letter.message ? `<div class="body-text" style="margin-top:0.2rem;">${escapeHtml(letter.message)}</div>` : ''}

                            <div class="ref-date-row">
                                <span>F.Y. ${escapeHtml(letter.fiscal_year || '—')} (Ref. ${escapeHtml(letter.ref_no || '—')})</span>
                                <span>Date: ${dateDisplay}</span>
                            </div>

                            <div class="details-grid">
                                ${detailsHtml}
                            </div>
                        </div>

                        ${sigHtml}

                        <div class="letter-place">
                            ${escapeHtml(letter.sign_place || 'Galkot, Baglung')}
                        </div>

                        <div class="qr-section">
                            <div class="qr-label">🔍 Scan to Verify</div>
                            <div class="qr-box" id="qrCodeContainer"></div>
                            <div class="qr-url">${escapeHtml(qrUrl)}</div>
                        </div>

                        <div class="letter-footer-area">
                            <span class="footer-text">This LHE document has been verified through our system.</span>
                            <span class="stamp">
                                <span class="dot"></span>
                                VERIFIED
                                <span class="dot"></span>
                            </span>
                        </div>

                        <div class="action-buttons no-print">
                            <button class="btn-action primary" onclick="window.print()">🖨️ Print Document</button>
                            <button class="btn-action" onclick="shareLetter()">📤 Share</button>
                        </div>
                    </div>
                `;

                letterContainer.innerHTML = html;
                resultSection.classList.add('visible');

                // Generate QR Code
                setTimeout(() => {
                    const qrContainer = document.getElementById('qrCodeContainer');
                    if (qrContainer && typeof QRCode !== 'undefined') {
                        qrContainer.innerHTML = '';
                        new QRCode(qrContainer, {
                            text: qrUrl,
                            width: 140,
                            height: 140,
                            colorDark: '#0B1E30',
                            colorLight: '#FFFFFF',
                            correctLevel: QRCode.CorrectLevel.H
                        });
                    } else {
                        console.warn('QRCode library not loaded');
                    }
                }, 150);
            }

            // ─── Share Function ────────────────────────────────────────────────────
            window.shareLetter = function() {
                const vid = new URLSearchParams(window.location.search).get('vid') || '';
                const url = window.location.href;
                if (navigator.share) {
                    navigator.share({
                        title: 'Rotaract Club - LHE Document',
                        text: 'Verify LHE document: ' + vid,
                        url: url,
                    }).catch(() => {});
                } else {
                    navigator.clipboard.writeText(url).then(() => {
                        alert('✅ Link copied to clipboard!');
                    }).catch(() => {
                        const textarea = document.createElement('textarea');
                        textarea.value = url;
                        document.body.appendChild(textarea);
                        textarea.select();
                        document.execCommand('copy');
                        document.body.removeChild(textarea);
                        alert('✅ Link copied to clipboard!');
                    });
                }
            };

            // ─── Verify Document ──────────────────────────────────────────────────
            async function verifyDocument(vid) {
                if (!supabaseClient) {
                    loader.innerHTML = '⚠️ Server connection failed.';
                    showBanner('❌', 'Server Error', 'Please try again later.', 'error');
                    return;
                }

                if (!vid) {
                    loaderText.textContent = '🔍 Please provide a verification ID.';
                    showBanner('ℹ️', 'ID Required', 'Add ?vid=... to the URL or scan a QR code.', 'error');
                    loader.style.display = 'none';
                    renderLetter(null);
                    return;
                }

                try {
                    loaderText.textContent = '🔍 Verifying LHE document...';

                    const { data, error } = await supabaseClient
                        .from('rotaract_lhe')
                        .select('*')
                        .eq('verification_id', vid)
                        .eq('letter_status', 'Active')
                        .maybeSingle();

                    if (error) throw error;

                    if (data) {
                        showBanner('✅', '✅ VERIFIED LHE DOCUMENT', 
                            'This Letterhead Exchange document is authentic and officially issued by Rotaract Club of Galkot Baglung.', 
                            'success');
                        renderLetter(data);
                    } else {
                        showBanner('❌', '❌ LHE DOCUMENT NOT FOUND', 
                            'This document is either inactive, archived, or does not exist in our records.', 
                            'error');
                        renderLetter(null);
                    }

                } catch (err) {
                    console.error('Verification error:', err);
                    showBanner('❌', '⚠️ Server Error', 'Please try again later.', 'error');
                    renderLetter(null);
                } finally {
                    loader.style.display = 'none';
                }
            }

            // ─── Get VID from URL ──────────────────────────────────────────────────
            function getVidFromUrl() {
                const params = new URLSearchParams(window.location.search);
                return params.get('vid');
            }

            // ─── Init ──────────────────────────────────────────────────────────────
            const vid = getVidFromUrl();

            if (vid) {
                verifyDocument(vid);
            } else {
                loaderText.textContent = '🔍 Please provide a verification ID.';
                showBanner('ℹ️', 'ID Required', 'Add ?vid=... to the URL or scan a QR code.', 'error');
                loader.style.display = 'none';
                renderLetter(null);
            }

            console.log('✅ LHE Verify — ready. VID:', vid);

        })();
    </script>

</body>
</html>
