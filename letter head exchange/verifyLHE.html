<script>
/* ══════════════════════════════════════════════════════════════════════
   LHE Shared Runtime (minimal version)
   ══════════════════════════════════════════════════════════════════════ */

(function (global) {
  'use strict';

  const CONFIG = {
    supabaseUrl: 'https://kbyfvqkfcxqgjjtfvvxf.supabase.co',
    supabaseAnonKey: 'sb_publishable_-bOiDndDXdz_FgXq1MFkag_ioCcg8nv',
    clubName: 'Rotaract Club of Galkot Baglung',
    rid: '3292',
    sponsoredClub: 'Rotaract Club of Baglung',
    charterDate: '23 April 2021',
    logoPath: 'rotaract.jpg',
    headerImagePath: 'clubheading.jpg',
    footerImagePath: 'footer.jpg',
    signatures: {
      president: { name: 'Rtr. Nabin Chalise', title: 'President RY 2026-27', image: 'presidentsign.jpg' },
      secretary: { name: 'Rtr. Madan Subedi', title: 'Secretary RY 2026-27', image: 'secretarysign.jpg' },
      chair: { name: 'Rtr. Anil Shrestha', title: 'International Service Chair (2026-27)', image: 'anilsign.jpg' }
    },
    signPlace: 'Galkot, Baglung',
    fiscalYear: '026/027',
    verifyBaseUrl: 'https://galkot.netlify.app/verifyLHE.html',
    defaultRotaryYear: '2026-27'
  };

  function escapeHtml(text) {
    if (text === null || text === undefined || text === '') return '';
    const div = document.createElement('div');
    div.textContent = String(text);
    return div.innerHTML;
  }

  function formatDate(value) {
    if (!value) return '—';
    try {
      return new Date(value).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    } catch (e) {
      return String(value);
    }
  }

  function sealSvg({ size = 92, verified = true } = {}) {
    const color = verified ? '#157A46' : '#B0392B';
    const label = verified ? 'VERIFIED' : 'NOT FOUND';
    return `
      <svg class="lhe-seal" viewBox="0 0 100 100" width="${size}" height="${size}" role="img" aria-label="${label} seal">
        <g class="seal-ring">
          ${Array.from({ length: 20 }).map((_, i) => {
            const a = (i / 20) * Math.PI * 2;
            const x1 = 50 + Math.cos(a) * 44, y1 = 50 + Math.sin(a) * 44;
            const x2 = 50 + Math.cos(a) * 49, y2 = 50 + Math.sin(a) * 49;
            return `<line x1="${x1.toFixed(2)}" y1="${y1.toFixed(2)}" x2="${x2.toFixed(2)}" y2="${y2.toFixed(2)}" stroke="${color}" stroke-width="2.6" stroke-linecap="round"/>`;
          }).join('')}
        </g>
        <circle cx="50" cy="50" r="40" fill="none" stroke="${color}" stroke-width="2"/>
        <circle cx="50" cy="50" r="35" fill="${verified ? '#E5F6EC' : '#FCEAE7'}" />
        ${verified
          ? `<path d="M36 51 L46 61 L65 40" fill="none" stroke="${color}" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>`
          : `<path d="M40 40 L60 60 M60 40 L40 60" stroke="${color}" stroke-width="5" stroke-linecap="round"/>`}
      </svg>`;
  }

  function verifyUrlFor(vid) {
    return `${CONFIG.verifyBaseUrl}?vid=${encodeURIComponent(vid)}`;
  }

  function renderLetterDoc(letter) {
    const vid = letter.verification_id || '';
    const qrUrl = verifyUrlFor(vid);
    const dateDisplay = formatDate(letter.created_at || letter.date);

    return `
      <div class="verified-stamp">${sealSvg({ size: 22 })}<span>VERIFIED LHE DOCUMENT</span></div>

      <div class="letter-header">
        <div class="club-name">${escapeHtml(CONFIG.clubName)}</div>
        <div class="club-place">RID ${escapeHtml(CONFIG.rid)} • Sponsored: ${escapeHtml(CONFIG.sponsoredClub)}</div>
      </div>

      <div class="ref-date-row">
        <span>F.Y. ${escapeHtml(CONFIG.fiscalYear)} (Ref. LHE-${escapeHtml(vid || '—')})</span>
        <span>Date: ${dateDisplay}</span>
      </div>

      <div class="letter-to">
        <span class="to-label">To</span>
        ${escapeHtml(letter.president_name || '—')}, President, RY ${escapeHtml(letter.rotary_year || CONFIG.defaultRotaryYear)}, ${escapeHtml(letter.club_name || '—')}
      </div>

      <div class="letter-subject">Letterhead Exchange</div>

      <div class="letter-body">Dear ${escapeHtml(letter.president_name || 'President')},

On behalf of ${CONFIG.clubName}, I extend our heartfelt congratulations and best wishes to you and your Board of Directors for a successful Rotary Year ${escapeHtml(letter.rotary_year || CONFIG.defaultRotaryYear)}. May your tenure be filled with impactful service, inspiring leadership, and meaningful achievements.

Since our charter on ${CONFIG.charterDate}, our club has remained committed to community service, youth empowerment, leadership development, and fellowship. We sincerely appreciate the contributions of ${escapeHtml(letter.club_name || 'your club')} to the Rotaract movement.

Through this Letterhead Exchange, we celebrate the spirit of friendship and collaboration between our clubs. We look forward to building a strong and lasting relationship through service and fellowship.

Wishing you and your club a successful Rotary Year ahead.

Thank you!</div>

      <div class="details-grid">
        <div class="detail-item"><div class="k">Recipient RID</div><div class="v">${escapeHtml(letter.rid || '—')}</div></div>
        <div class="detail-item"><div class="k">Recipient Club</div><div class="v">${escapeHtml(letter.club_name || '—')}</div></div>
        <div class="detail-item"><div class="k">Verification ID</div><div class="v">${escapeHtml(vid || '—')}</div></div>
        <div class="detail-item"><div class="k">Issued</div><div class="v">${dateDisplay}</div></div>
        <div class="detail-item"><div class="k">Status</div><div class="v"><span class="status-badge approved">✅ Approved</span></div></div>
      </div>

      <div class="letter-signature">
        <div>
          <div class="sig-name">${escapeHtml(CONFIG.signatures.secretary.name)}</div>
          <img src="${escapeHtml(CONFIG.signatures.secretary.image)}" alt="" class="sig-img" onerror="this.style.display='none'" />
          <div class="sig-title">${escapeHtml(CONFIG.signatures.secretary.title)}</div>
        </div>
        <div>
          <div class="sig-label">Yours in Rotaract</div>
          <div class="sig-name">${escapeHtml(CONFIG.signatures.chair.name)}</div>
          <img src="${escapeHtml(CONFIG.signatures.chair.image)}" alt="" class="sig-img" onerror="this.style.display='none'" />
          <div class="sig-title">${escapeHtml(CONFIG.signatures.chair.title)}</div>
        </div>
        <div>
          <div class="sig-name">${escapeHtml(CONFIG.signatures.president.name)}</div>
          <img src="${escapeHtml(CONFIG.signatures.president.image)}" alt="" class="sig-img" onerror="this.style.display='none'" />
          <div class="sig-title">${escapeHtml(CONFIG.signatures.president.title)}</div>
        </div>
      </div>

      <div class="letter-place">${escapeHtml(CONFIG.signPlace)}</div>

      <div class="letter-footer-wrap">
        <div class="footer-img"><img src="${CONFIG.footerImagePath}" alt="" onerror="this.parentElement.style.display='none'" /></div>
        <div class="qr-section">
          <div class="qr-label">Scan to verify</div>
          <div class="qr-box" id="qrCodeContainer" data-qr-url="${escapeHtml(qrUrl)}"></div>
          <div class="qr-url">${escapeHtml(qrUrl)}</div>
        </div>
      </div>

      <div class="letter-footer-area">
        <span class="footer-text">This LHE document has been verified through our system.</span>
      </div>
    `;
  }

  function renderQrInto(containerEl, url, size) {
    if (!containerEl) return;
    if (typeof global.QRCode === 'undefined') {
      containerEl.innerHTML = '<span style="font-size:.7rem;color:var(--gray-400);">QR unavailable offline</span>';
      return;
    }
    containerEl.innerHTML = '';
    new global.QRCode(containerEl, {
      text: url,
      width: size || 130,
      height: size || 130,
      colorDark: '#0B1E30',
      colorLight: '#FFFFFF',
      correctLevel: global.QRCode.CorrectLevel.H
    });
  }

  function createSupabaseClient() {
    try {
      if (typeof window.supabase !== 'undefined' && window.supabase.createClient) {
        return window.supabase.createClient(CONFIG.supabaseUrl, CONFIG.supabaseAnonKey);
      }
      console.warn('⚠️ Supabase library not loaded.');
      return null;
    } catch (e) {
      console.error('❌ Failed to init Supabase client:', e);
      return null;
    }
  }

  let toastContainer = null;
  function ensureToastContainer() {
    if (toastContainer && document.body.contains(toastContainer)) return toastContainer;
    toastContainer = document.getElementById('toastContainer');
    if (!toastContainer) {
      toastContainer = document.createElement('div');
      toastContainer.id = 'toastContainer';
      toastContainer.className = 'toast-container no-print';
      document.body.appendChild(toastContainer);
    }
    return toastContainer;
  }

  function showToast(message, type = 'info', duration = 4200) {
    const container = ensureToastContainer();
    const toast = document.createElement('div');
    toast.className = `toast ${type}`;
    const icons = { success: '✅', error: '⚠️', info: 'ℹ️' };
    toast.innerHTML = `
      <span class="toast-icon">${icons[type] || icons.info}</span>
      <span class="toast-msg">${escapeHtml(message)}</span>
      <button type="button" class="toast-close" aria-label="Dismiss">✕</button>
    `;
    container.appendChild(toast);
    const remove = () => {
      toast.classList.add('leaving');
      setTimeout(() => toast.remove(), 260);
    };
    toast.querySelector('.toast-close').addEventListener('click', remove);
    const timer = setTimeout(remove, duration);
    toast.addEventListener('mouseenter', () => clearTimeout(timer));
    return toast;
  }

  global.LHE = {
    CONFIG,
    escapeHtml,
    formatDate,
    sealSvg,
    renderLetterDoc,
    renderQrInto,
    createSupabaseClient,
    showToast,
    verifyUrlFor
  };
})(window);
</script>
</head>

<script>
(function () {
  'use strict';

  function boot() {
    // Wait for LHE to be defined
    if (!window.LHE) { 
      setTimeout(boot, 50); 
      return; 
    }
    
    // Check if Supabase is available
    if (typeof supabase === 'undefined' || !supabase.createClient) {
      console.warn('Supabase not loaded yet, retrying...');
      setTimeout(boot, 100);
      return;
    }

    console.log('✅ Supabase library loaded');
    console.log('✅ LHE library loaded');

    const { escapeHtml, renderLetterDoc, renderQrInto, showToast, sealSvg } = window.LHE;

    // Create Supabase client directly
    let supabaseClient = null;
    try {
      if (window.supabase && window.supabase.createClient) {
        supabaseClient = window.supabase.createClient(
          'https://kbyfvqkfcxqgjjtfvvxf.supabase.co',
          'sb_publishable_-bOiDndDXdz_FgXq1MFkag_ioCcg8nv'
        );
        console.log('✅ Supabase client created successfully');
      } else {
        console.error('❌ Supabase library not available');
      }
    } catch (err) {
      console.error('❌ Failed to create Supabase client:', err);
    }

    // ─── DOM refs ──────────────────────────────────────────────────
    const loginOverlay = document.getElementById('loginOverlay');
    const loginForm = document.getElementById('loginForm');
    const loginEmail = document.getElementById('loginEmail');
    const loginPassword = document.getElementById('loginPassword');
    const loginBtn = document.getElementById('loginBtn');
    const loginLoader = document.getElementById('loginLoader');
    const loginError = document.getElementById('loginError');
    const appRoot = document.getElementById('appRoot');
    const userEmail = document.getElementById('userEmail');
    const userAvatar = document.getElementById('userAvatar');
    const logoutBtn = document.getElementById('logoutBtn');

    const loaderRow = document.getElementById('loaderRow');
    const loaderText = document.getElementById('loaderText');
    const verifyBanner = document.getElementById('verifyBanner');
    const bannerIcon = document.getElementById('bannerIcon');
    const bannerTitle = document.getElementById('bannerTitle');
    const bannerText = document.getElementById('bannerText');
    const verifyResult = document.getElementById('verifyResult');
    const letterContainer = document.getElementById('letterContainer');

    let currentUser = null;
    let currentVid = null;
    let currentRequest = null;

    // ─── Auth Functions ────────────────────────────────────────────
    async function checkAdminRole(userId) {
      if (!supabaseClient || !userId) return false;
      try {
        const { data, error } = await supabaseClient
          .from('user_roles')
          .select('role, status')
          .eq('user_id', userId)
          .maybeSingle();
        if (error) throw error;
        return !!(data && data.role === 'admin' && data.status === 'active');
      } catch (e) {
        console.error('Role check error:', e);
        return false;
      }
    }

    async function checkSession() {
      if (!supabaseClient) return false;
      try {
        const { data: { session }, error } = await supabaseClient.auth.getSession();
        if (error) throw error;
        if (session && session.user) { 
          currentUser = session.user; 
          return true; 
        }
        return false;
      } catch (e) {
        console.error('Session check error:', e);
        return false;
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const email = loginEmail.value.trim();
      const password = loginPassword.value;
      if (!email || !password) {
        loginError.textContent = 'Please enter your email and password.';
        loginError.classList.add('visible');
        return;
      }

      loginBtn.disabled = true;
      loginLoader.classList.add('active');
      loginError.classList.remove('visible');

      try {
        if (!supabaseClient) throw new Error('Connection not ready. Please refresh.');
        const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (error) throw error;

        if (data.user) {
          const isAdmin = await checkAdminRole(data.user.id);
          if (!isAdmin) {
            await supabaseClient.auth.signOut();
            loginError.textContent = 'Access denied — only admins can verify documents.';
            loginError.classList.add('visible');
            return;
          }
          currentUser = data.user;
          showToast('Welcome!', 'success');
          showApp();
        }
      } catch (err) {
        console.error('Login error:', err);
        loginError.textContent = err.message || 'Invalid email or password.';
        loginError.classList.add('visible');
      } finally {
        loginBtn.disabled = false;
        loginLoader.classList.remove('active');
      }
    }

    async function handleLogout() {
      if (!supabaseClient) return;
      try {
        await supabaseClient.auth.signOut();
        currentUser = null;
        showLogin();
        showToast('Logged out.', 'info');
      } catch (e) {
        console.error('Logout error:', e);
      }
    }

    function showApp() {
      loginOverlay.classList.remove('active');
      appRoot.style.display = 'block';
      userEmail.textContent = currentUser?.email || 'Admin';
      userAvatar.textContent = (currentUser?.email || 'A')[0].toUpperCase();
      // Verify the document after login
      if (currentVid) verifyDocument(currentVid);
    }

    function showLogin() {
      loginOverlay.classList.add('active');
      appRoot.style.display = 'none';
      loginForm.reset();
      loginError.classList.remove('visible');
    }

    // ─── Verification Functions ────────────────────────────────────
    function showBanner(icon, title, text, type) {
      bannerIcon.textContent = icon;
      bannerTitle.textContent = title;
      bannerText.textContent = text;
      verifyBanner.className = `verify-banner visible ${type}`;
    }

    function renderNotFound(vid) {
      letterContainer.innerHTML = `
        <div class="not-found-box">
          ${sealSvg({ size: 88, verified: false })}
          <h2>Document not found</h2>
          <p>${vid ? `We couldn't verify a document for <code>${escapeHtml(vid)}</code>.` : 'No verification ID was provided.'} It may be inactive, archived, or the link may be incorrect.</p>
          <div class="action-buttons no-print">
            <a class="btn-action primary" href="LHE.html">📝 Submit an LHE request</a>
          </div>
        </div>`;
      verifyResult.classList.add('visible');
    }

    function renderPendingRequest(request) {
      letterContainer.innerHTML = `
        <div class="pending-request-box">
          <span class="icon-big">⏳</span>
          <h2>Request is Pending Approval</h2>
          <p>This LHE request has been submitted but is still awaiting verification by the admin.</p>
          <div class="details">
            <div class="row"><span class="label">Club:</span><span class="value">${escapeHtml(request.club_name || '—')}</span></div>
            <div class="row"><span class="label">President:</span><span class="value">${escapeHtml(request.president_name || '—')}</span></div>
            <div class="row"><span class="label">RID:</span><span class="value">${escapeHtml(request.rid || '—')}</span></div>
            <div class="row"><span class="label">Rotary Year:</span><span class="value">${escapeHtml(request.rotary_year || '—')}</span></div>
            <div class="row"><span class="label">Submitted:</span><span class="value">${formatDate(request.created_at)}</span></div>
            <div class="row"><span class="label">Status:</span><span class="value"><span class="status-badge pending">⏳ Pending</span></span></div>
          </div>
          <div class="action-buttons no-print" style="margin-top:1.5rem;">
            <a class="btn-action primary" href="adminLHE.html">🔐 Go to Admin Panel</a>
            <a class="btn-action" href="LHE.html">📝 Submit another request</a>
          </div>
        </div>`;
      verifyResult.classList.add('visible');
    }

    function renderApprovedRequest(request) {
      letterContainer.innerHTML = `
        <div class="letter-doc" id="letterDoc">
          ${renderLetterDoc(request)}
          <div class="action-buttons no-print">
            <button class="btn-action primary" id="printBtn">🖨️ Print document</button>
            <button class="btn-action" id="shareBtn">📤 Share</button>
          </div>
        </div>`;
      verifyResult.classList.add('visible');

      const qrBox = document.getElementById('qrCodeContainer');
      if (qrBox) {
        setTimeout(() => renderQrInto(qrBox, qrBox.dataset.qrUrl, 140), 120);
      }

      document.getElementById('printBtn')?.addEventListener('click', () => window.print());
      document.getElementById('shareBtn')?.addEventListener('click', () => shareLetter(request.verification_id));
    }

    async function shareLetter(vid) {
      const url = window.location.href;
      if (navigator.share) {
        try { await navigator.share({ title: 'Rotaract Club — LHE document', text: 'Verify LHE document: ' + (vid || ''), url }); }
        catch (e) { /* user cancelled */ }
        return;
      }
      try {
        await navigator.clipboard.writeText(url);
        showToast('Link copied to clipboard.', 'success');
      } catch (e) {
        const ta = document.createElement('textarea');
        ta.value = url;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        ta.remove();
        showToast('Link copied to clipboard.', 'success');
      }
    }

    async function verifyDocument(vid) {
      if (!supabaseClient) {
        loaderText.textContent = 'Connection issue.';
        showBanner('⚠️', 'Server error', 'Please refresh and try again.', 'error');
        loaderRow.style.display = 'none';
        renderNotFound(vid);
        return;
      }
      if (!vid) {
        loaderText.textContent = 'No verification ID provided.';
        showBanner('ℹ️', 'ID required', 'Add ?vid=… to the URL, or scan the QR code on your LHE letter.', 'error');
        loaderRow.style.display = 'none';
        renderNotFound(null);
        return;
      }

      try {
        // First try to find in rotaract_lhe_requests table
        const { data: requestData, error: requestError } = await supabaseClient
          .from('rotaract_lhe_requests')
          .select('*')
          .eq('verification_id', vid)
          .maybeSingle();

        if (requestError) throw requestError;

        if (requestData) {
          currentRequest = requestData;
          
          // Check status
          if (requestData.status === 'pending') {
            showBanner('⏳', 'Request Pending', 'This LHE request is awaiting admin approval.', 'warning');
            loaderRow.style.display = 'none';
            renderPendingRequest(requestData);
            return;
          } else if (requestData.status === 'approved') {
            showBanner('✅', 'Verified LHE Document', 'This Letterhead Exchange document is authentic and was officially issued by Rotaract Club of Galkot Baglung.', 'success');
            loaderRow.style.display = 'none';
            renderApprovedRequest(requestData);
            return;
          } else if (requestData.status === 'rejected') {
            showBanner('❌', 'Request Rejected', 'This LHE request was rejected and is no longer valid.', 'error');
            loaderRow.style.display = 'none';
            renderNotFound(vid);
            return;
          }
        }

        // If not found in requests, check if it's in the LHE table (legacy)
        const { data: lheData, error: lheError } = await supabaseClient
          .from('rotaract_lhe')
          .select('*')
          .eq('verification_id', vid)
          .eq('letter_status', 'Active')
          .maybeSingle();

        if (lheError) throw lheError;

        if (lheData) {
          showBanner('✅', 'Verified LHE Document', 'This Letterhead Exchange document is authentic and was officially issued by Rotaract Club of Galkot Baglung.', 'success');
          loaderRow.style.display = 'none';
          renderApprovedRequest({
            ...lheData,
            president_name: lheData.recipient_name,
            club_name: lheData.recipient_club_name,
            rid: lheData.recipient_rid,
            rotary_year: '2026-27',
            created_at: lheData.date,
            verification_id: lheData.verification_id,
            status: 'approved'
          });
          return;
        }

        // Not found anywhere
        showBanner('⚠️', 'Document not found', 'This document is either inactive, archived, or does not exist in our records.', 'error');
        renderNotFound(vid);
      } catch (err) {
        console.error('Verification error:', err);
        showBanner('⚠️', 'Server error', 'Please try again later.', 'error');
        renderNotFound(vid);
      } finally {
        loaderRow.style.display = 'none';
      }
    }

    // ─── Event Listeners ───────────────────────────────────────────
    loginForm.addEventListener('submit', handleLogin);
    logoutBtn.addEventListener('click', handleLogout);

    // ─── Init ──────────────────────────────────────────────────────
    async function init() {
      currentVid = new URLSearchParams(window.location.search).get('vid');
      
      const hasSession = await checkSession();
      if (hasSession && currentUser) {
        const isAdmin = await checkAdminRole(currentUser.id);
        if (isAdmin) { 
          showApp(); 
          return; 
        }
        await supabaseClient.auth.signOut();
      }
      showLogin();
      
      // If no vid, show message
      if (!currentVid) {
        loaderText.textContent = 'No verification ID provided.';
        showBanner('ℹ️', 'ID required', 'Add ?vid=… to the URL, or scan the QR code on your LHE letter.', 'error');
        loaderRow.style.display = 'none';
        renderNotFound(null);
      }
    }

    init();
  }

  boot();
})();
</script>
</body>
</html>
